# ==============================================================
# mail.efbazaar.uz — Mailcow reverse proxy
#
# Phase 1 (hozir): HTTP-only. Let's Encrypt ACME challenge uchun.
# Phase 2 (Mailcow o'rnatilgach): HTTPS + Mailcow proxy qo'shamiz.
#
# Nima uchun ikki bosqich:
# - HTTPS server block ssl_certificate talab qiladi
# - Sertifikat esa hali yo'q — uni olish uchun avval HTTP-01 challenge
#   ishlashi kerak
# - Sertifikat olingach — HTTPS block'ni qo'shamiz va Mailcow'ga proxy qilamiz
# ==============================================================

server {
    listen 80;
    listen [::]:80;
    server_name mail.efbazaar.uz autodiscover.efbazaar.uz autoconfig.efbazaar.uz;

    # ACME challenge (efbazaar-certbot shu volume orqali fayllarni yozadi)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Boshqa hamma so'rovlar uchun placeholder (Mailcow hali o'rnatilmagan)
    location / {
        return 200 "mail.efbazaar.uz — Mailcow o'rnatilmoqda\n";
        add_header Content-Type text/plain;
    }
}

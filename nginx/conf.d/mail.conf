# ==============================================================
# mail.efbazaar.uz — efBazaar custom webmail app (Next.js)
#
# Mailcow barcha yo'llari endi mailcow.efbazaar.uz'da (nginx/conf.d/mailcow.conf).
# Bu subdomain to'liq custom webmail'ga beriladi — hech qanday Mailcow carve-out
# yo'q, faqat trade-service /api/v1/mail/** API'sini iste'mol qiluvchi read-only
# webmail UI.
#
# Login yo'q — auth cookielar Domain=efbazaar.uz bilan yozilgani sabab asosiy
# saytdagi session shu subdomain'da ham amal qiladi.
#
# MX/SMTP/IMAP — HTTP emas, bu configga aloqasi yo'q; Mailcow o'z portlarida
# host'da tinglaydi va DNS `mail.efbazaar.uz` orqali kelgan email trafigi
# to'g'ridan-to'g'ri Mailcow'ga boradi (nginx faqat 80/443'ni ushlaydi).
# ==============================================================

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name mail.efbazaar.uz;

    # Let's Encrypt renewal uchun
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — mail.efbazaar.uz: custom webmail app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.efbazaar.uz;

    ssl_certificate     /etc/letsencrypt/live/mail.efbazaar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.efbazaar.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # Backend variables — re-resolved per request via http-level resolver.
    include /etc/nginx/conf.d/backends.inc;

    # ----- webmail app'ning o'z API proxy'si -------------------------
    # Browser /api/trade/v1/mail/... deb chaqiradi — bu mail-frontend
    # ichidagi Next.js route handler (u ichkaridan nginx:8080 ga boradi).
    location /api/trade/ {
        proxy_pass http://$backend_mail$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ----- webmail app (hamma qolgan yo'llar) ------------------------
    location / {
        proxy_pass http://$backend_mail$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}

# ==============================================================
# mail.efbazaar.uz — Mailcow reverse proxy
#
# Arxitektura:
#   Internet → efbazaar-nginx (443) → host.docker.internal:8443 → Mailcow
#
# Mailcow HTTP/HTTPS portlari host'da 127.0.0.1'ga bog'langan
# (mailcow.conf: HTTP_BIND=127.0.0.1, HTTPS_BIND=127.0.0.1).
# nginx konteynerdan host loopback'ga yetish uchun docker-compose'da
# extra_hosts: host.docker.internal:host-gateway kerak.
# ==============================================================

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name mail.efbazaar.uz autodiscover.efbazaar.uz autoconfig.efbazaar.uz;

    # Let's Encrypt renewal uchun
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Mailcow web UI/SOGo/autodiscover
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.efbazaar.uz autodiscover.efbazaar.uz autoconfig.efbazaar.uz;

    ssl_certificate     /etc/letsencrypt/live/mail.efbazaar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.efbazaar.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # Mailcow attachment / import fayllari uchun katta limit
    client_max_body_size 0;

    # Mailcow uzun so'rovlar (SOGo sync, import) uchun katta timeout
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        # Backend HTTPS (Mailcow ichki nginx), self-signed cert
        proxy_pass https://host.docker.internal:8443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Upgrade           $http_upgrade;

        proxy_redirect off;
    }
}

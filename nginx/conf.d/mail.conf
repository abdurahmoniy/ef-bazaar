# ==============================================================
# mail.efbazaar.uz — efBazaar webmail app + Mailcow carve-outs
#
# Arxitektura:
#   Internet → efbazaar-nginx (443) ─┬→ mail-frontend:3000 (Next.js webmail)
#                                    └→ host.docker.internal:8443 → Mailcow
#
# Root (/) endi buyer'larga ko'rinadigan read-only webmail app.
# Mailcow'ning FUNKSIONAL yo'llari saqlanadi:
#   /api/                      — Mailcow admin API (smart-admin-worker
#                                MAILCOW_API_URL shu orqali ishlaydi!)
#   /SOGo/                     — SOGo webmail (admin ehtiyoji uchun)
#   /Microsoft-Server-ActiveSync — mobil sync
#   autodiscover/autoconfig hostlari — to'liq Mailcow'da qoladi
#
# Mailcow'ning O'Z admin UI'si (/, /admin, /user) endi tashqaridan ochilmaydi
# — kerak bo'lsa SSH tunnel orqali 127.0.0.1:8443 ga kiring (u baribir
# loopback'da tinglaydi).
#
# IMAP (993) / SMTP (465/587) — HTTP emas, bu configga aloqasi yo'q;
# to'g'ridan-to'g'ri host portlarida qoladi.
#
# Mailcow HTTP/HTTPS portlari host'da 127.0.0.1'ga bog'langan
# (mailcow.conf: HTTP_BIND=127.0.0.1, HTTPS_BIND=127.0.0.1).
# nginx konteynerdan host loopback'ga yetish uchun docker-compose'da
# extra_hosts: host.docker.internal:host-gateway kerak.
# ==============================================================

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name mail.efbazaar.uz autodiscover.efbazaar.uz autoconfig.efbazaar.uz;

    # Let's Encrypt renewal uchun
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — autodiscover/autoconfig: to'liq Mailcow (o'zgarmagan)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autodiscover.efbazaar.uz autoconfig.efbazaar.uz;

    ssl_certificate     /etc/letsencrypt/live/mail.efbazaar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.efbazaar.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    client_max_body_size 0;

    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass https://host.docker.internal:8443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Upgrade           $http_upgrade;

        proxy_redirect off;
    }
}

# HTTPS — mail.efbazaar.uz: webmail app (root) + Mailcow carve-outs
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.efbazaar.uz;

    ssl_certificate     /etc/letsencrypt/live/mail.efbazaar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.efbazaar.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # Backend variables — re-resolved per request via http-level resolver.
    include /etc/nginx/conf.d/backends.inc;

    # Server-level defaultlar Mailcow locationlariga meros bo'ladi (app
    # locationlari proxy-common.inc bilan o'zinikini o'rnatadi).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Upgrade           $http_upgrade;

    # ----- webmail app'ning o'z API proxy'si -------------------------
    # Browser /api/trade/v1/mail/... deb chaqiradi — bu mail-frontend
    # ichidagi Next.js route handler (u ichkaridan nginx:8080 ga boradi).
    # Prefix uzunligi bo'yicha /api/ dan ustun keladi.
    location /api/trade/ {
        proxy_pass http://$backend_mail$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ----- Mailcow admin API -----------------------------------------
    # smart-admin-worker MAILCOW_API_URL=https://mail.efbazaar.uz/api/v1
    # shu yo'ldan mailbox yaratadi/rotatsiya qiladi. BUZILMASIN.
    location /api/ {
        client_max_body_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_pass https://host.docker.internal:8443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_redirect off;
    }

    # ----- SOGo webmail (admin ehtiyoji) ------------------------------
    location /SOGo {
        client_max_body_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_pass https://host.docker.internal:8443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_redirect off;
    }

    # ----- ActiveSync (mobil mail clientlar) --------------------------
    location /Microsoft-Server-ActiveSync {
        client_max_body_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout    1200s;
        proxy_read_timeout    1200s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_pass https://host.docker.internal:8443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_redirect off;
    }

    # ----- webmail app (hamma qolgan yo'llar) ------------------------
    location / {
        proxy_pass http://$backend_mail$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}

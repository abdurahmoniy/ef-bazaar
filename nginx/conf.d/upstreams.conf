# ==============================================================
# Upstreams — internal docker network ichida
# ==============================================================

upstream auth_upstream {
    server auth-service:8081;
    keepalive 32;
}

upstream marketplace_upstream {
    server marketplace-service:8082;
    keepalive 32;
}

upstream recommendation_upstream {
    server recommendation-service:8083;
    keepalive 32;
}

upstream bot_upstream {
    server bot:8084;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

# ==============================================================
# efBazaar — Reverse proxy site config
# Route table:
#   /api/auth/**         → auth-service (endpointlar o'zlari auth ni boshqaradi)
#   /api/marketplace/**  → marketplace-service (auth_request OPTIONAL — anonymous fallback)
#   /api/rec/**          → recommendation-service (auth_request OPTIONAL)
#   /bot/webhook         → bot (Telegram chaqiradi, JWT yo'q)
#   /actuator/**         → bloklangan
#   /                    → frontend SPA
#
# Auth flow (marketplace/rec uchun):
#   1. Token bor → auth_request /_auth_verify → 204 + X-User-Id/Roles/Telegram-Id headers → forward
#   2. Token yo'q yoki noto'g'ri → error_page 401 → @anon location → proxy_pass WITHOUT user headers
#   3. Servis Spring Security orqali public vs protected endpointlarni o'zi farqlaydi
# ==============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Health probe
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Actuator tashqaridan bloklangan
    location ~ ^/actuator/ {
        deny all;
        return 403;
    }

    # ---------- Internal auth verify (subrequest target) ----------
    location = /_auth_verify {
        internal;
        proxy_pass http://auth_upstream/api/v1/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ---------- auth-service ----------
    location /api/auth/ {
        proxy_pass http://auth_upstream/api/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---------- marketplace-service (auth optional) ----------
    location /api/marketplace/ {
        auth_request /_auth_verify;
        error_page 401 = @marketplace_anon;

        auth_request_set $user_id      $upstream_http_x_user_id;
        auth_request_set $user_roles   $upstream_http_x_user_roles;
        auth_request_set $telegram_id  $upstream_http_x_telegram_id;

        proxy_set_header X-User-Id     $user_id;
        proxy_set_header X-User-Roles  $user_roles;
        proxy_set_header X-Telegram-Id $telegram_id;

        proxy_pass http://marketplace_upstream/api/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location @marketplace_anon {
        # Token yo'q yoki noto'g'ri — anonymous so'rov sifatida o'tkazamiz.
        # Servisning o'zi protected endpointlarda 401 qaytaradi.
        rewrite ^/api/marketplace/(.*)$ /api/$1 break;
        proxy_pass http://marketplace_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---------- recommendation-service ----------
    # MVP'da o'chirilgan (compose profile=extra). Yoqilganda upstream'ni
    # upstreams.conf'da uncomment qiling va bu blokni proxy_pass'ga qayta yozing.
    location /api/rec/ {
        default_type application/json;
        return 503 '{"error":"recommendation_service_unavailable","message":"Coming soon"}';
    }

    # ---------- bot webhook ----------
    location /bot/ {
        proxy_pass http://bot_upstream/bot/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---------- frontend SPA ----------
    location / {
        proxy_pass http://frontend_upstream/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}

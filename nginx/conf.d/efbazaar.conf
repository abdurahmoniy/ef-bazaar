# ==============================================================
# efbazaar.uz — asosiy domain (frontend + API)
#
# Route table:
#   /api/auth/**         → auth-service
#   /api/marketplace/**  → marketplace-service (auth_request OPTIONAL)
#   /api/rec/**          → 503 (recommendation-service profile=extra)
#   /bot/webhook         → bot (Telegram chaqiradi)
#   /actuator/**         → bloklangan
#   /                    → frontend SPA
#
# Auth flow (marketplace uchun):
#   1. Token bor → auth_request /_auth_verify → 204 + X-User-Id/Roles/Telegram-Id
#   2. Token yo'q yoki noto'g'ri → error_page 401 → @anon → proxy_pass WITHOUT headers
# ==============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- HTTP (80) — ACME challenge + HTTPS redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name efbazaar.uz nginx;

    # Let's Encrypt webroot challenge — bu http orqali ishlashi shart
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Hammasi HTTPS'ga redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (443) — asosiy site ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name efbazaar.uz nginx;

    ssl_certificate     /etc/letsencrypt/live/efbazaar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/efbazaar.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # Health probe (internal)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Actuator tashqaridan bloklangan
    location ~ ^/actuator/ {
        deny all;
        return 403;
    }

    # ---------- Internal auth verify (subrequest target) ----------
    location = /_auth_verify {
        internal;
        proxy_pass http://auth_upstream/api/v1/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Tomcat rejects Host with underscore (RFC-3986). Default $proxy_host
        # would be "auth_upstream" → 400. Override with the caller's host.
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ---------- auth-service ----------
    location /api/auth/ {
        proxy_pass http://auth_upstream/api/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---------- marketplace-service (auth optional) ----------
    location /api/marketplace/ {
        auth_request /_auth_verify;
        error_page 401 = @marketplace_anon;

        auth_request_set $user_id      $upstream_http_x_user_id;
        auth_request_set $user_roles   $upstream_http_x_user_roles;
        auth_request_set $telegram_id  $upstream_http_x_telegram_id;

        proxy_set_header X-User-Id     $user_id;
        proxy_set_header X-User-Roles  $user_roles;
        proxy_set_header X-Telegram-Id $telegram_id;

        proxy_pass http://marketplace_upstream/api/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location @marketplace_anon {
        rewrite ^/api/marketplace/(.*)$ /api/$1 break;
        proxy_pass http://marketplace_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---------- recommendation-service ----------
    location /api/rec/ {
        default_type application/json;
        return 503 '{"error":"recommendation_service_unavailable","message":"Coming soon"}';
    }

    # ---------- bot webhook ----------
    # Server-to-server endpoints (media upload) — faqat docker network ichida.
    # Public tarafdan 404: mavjudligini ham oshkor qilmaymiz.
    location /bot/internal/ {
        return 404;
    }

    location /bot/ {
        proxy_pass http://bot_upstream/bot/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---------- frontend SPA ----------
    location / {
        proxy_pass http://frontend_upstream/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}

# ---------- Default catch-all (har qanday boshqa Host) ----------
# Direct IP yoki noma'lum domen so'rovlari uchun 444 (no response).
# /healthz Docker healthcheck uchun ochiq qoladi.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Snake-oil/real sertifikat (TLS handshake yopilmasligi uchun)
    ssl_certificate     /etc/letsencrypt/live/efbazaar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/efbazaar.uz/privkey.pem;

    # Healthz — Docker healthcheck (wget -qO- http://localhost/healthz) uchun
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Boshqa hammasi — silent reject (server-level return ishlatmaymiz,
    # chunki u location matching'dan oldin ishlaydi).
    location / {
        return 444;
    }
}

# ---------- Internal — frontend → backend (Docker ichki tarmoq) ----------
server {
    listen 8080;
    server_name nginx;

    location = /_auth_verify {
        internal;
        proxy_pass http://auth_upstream/api/v1/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Tomcat rejects Host with underscore (RFC-3986). Default $proxy_host
        # would be "auth_upstream" → 400. Override with the caller's host.
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /api/auth/ {
        proxy_pass http://auth_upstream/api/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /api/marketplace/ {
        auth_request /_auth_verify;
        error_page 401 = @marketplace_anon;

        auth_request_set $user_id      $upstream_http_x_user_id;
        auth_request_set $user_roles   $upstream_http_x_user_roles;
        auth_request_set $telegram_id  $upstream_http_x_telegram_id;

        proxy_set_header X-User-Id     $user_id;
        proxy_set_header X-User-Roles  $user_roles;
        proxy_set_header X-Telegram-Id $telegram_id;

        proxy_pass http://marketplace_upstream/api/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location @marketplace_anon {
        rewrite ^/api/marketplace/(.*)$ /api/$1 break;
        proxy_pass http://marketplace_upstream;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}

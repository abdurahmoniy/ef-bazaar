# ==============================================================
# mailcow.efbazaar.uz — Mailcow'ning to'liq admin UI + API + SOGo + ActiveSync +
# autodiscover/autoconfig, hammasi bitta hostname ostida.
#
# `mail.efbazaar.uz` endi custom webmail app'ga to'liq beriladi
# (nginx/conf.d/mail.conf), Mailcow butunlay shu yerga ko'chdi.
#
# Ichki port: Mailcow HTTPS host loopback'ida (127.0.0.1:8443) tinglaydi
# (mailcow.conf: HTTP_BIND=127.0.0.1, HTTPS_BIND=127.0.0.1). Konteynerdan
# host loopback'ga yetish uchun docker-compose'da:
#   extra_hosts: host.docker.internal:host-gateway
#
# Nima YO'Q — IMAP (993) va SMTP (25/465/587) HTTP emas, bu configga
# aloqasi yo'q; ular Mailcow'ning o'z portlarida host'da to'g'ridan-to'g'ri
# tinglaydi va DNS `mail.efbazaar.uz` (yoki `mailcow.efbazaar.uz`,
# bir xil IP) orqali topiladi.
# ==============================================================

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name mailcow.efbazaar.uz autodiscover.efbazaar.uz autoconfig.efbazaar.uz;

    # Let's Encrypt renewal uchun
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — mailcow.efbazaar.uz + autodiscover + autoconfig: to'liq Mailcow proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 9080;  # vps-edge Traefik, TLS already terminated
    http2 on;
    server_name mailcow.efbazaar.uz autodiscover.efbazaar.uz autoconfig.efbazaar.uz;

    ssl_certificate     /etc/letsencrypt/live/mailcow.efbazaar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailcow.efbazaar.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    client_max_body_size 0;

    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;
    proxy_buffering off;
    proxy_request_buffering off;

    # ActiveSync — mobil klientlar uzoq-poll ishlatadi, timeout kattaroq
    location /Microsoft-Server-ActiveSync {
        proxy_send_timeout    1200s;
        proxy_read_timeout    1200s;

        proxy_pass https://host.docker.internal:8443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Upgrade           $http_upgrade;

        proxy_redirect off;
    }

    # Barcha qolgan yo'llar (/, /admin, /user, /SOGo, /api, /rspamd,
    # /autodiscover, /autoconfig, /.well-known/carddav|caldav, oauth va h.k.)
    # to'g'ridan-to'g'ri Mailcow'ga uzatiladi.
    location / {
        proxy_pass https://host.docker.internal:8443;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Upgrade           $http_upgrade;

        proxy_redirect off;
    }
}

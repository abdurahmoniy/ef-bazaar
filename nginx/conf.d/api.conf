# ==============================================================
# api.efbazaar.uz — browser API + aggregated Swagger UI
#
# Route table (HTTPS):
#   /api/**                 → marketplace-service (auth_request OPTIONAL)
#   /                       → /swagger-ui/index.html ga redirect (basic auth)
#   /swagger-ui/**          → auth-service /swagger-ui/** (springdoc-openapi UI)
#   /v3/api-docs/auth        → auth-service /v3/api-docs
#   /v3/api-docs/marketplace → marketplace-service /v3/api-docs
#   /v3/api-docs/bot         → bot /v3/api-docs
#   /healthz                → 200
#
# Swagger/OpenAPI nginx basic auth ostida (htpasswd /etc/nginx/auth/swagger.htpasswd).
# ==============================================================

map $http_origin $cors_allow_origin {
    default "";
    "~^https://efbazaar\.uz$" $http_origin;
    "~^https://api\.efbazaar\.uz$" $http_origin;
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
}

# ---------- HTTP (80) — ACME + redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.efbazaar.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (443) — Swagger UI ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.efbazaar.uz;

    # Single SAN cert ikkala domen uchun (efbazaar + api.efbazaar) — bir joydan o'qiymiz.
    ssl_certificate     /etc/letsencrypt/live/efbazaar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/efbazaar.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # Backend variables — re-resolved per request via http-level resolver.
    include /etc/nginx/conf.d/backends.inc;

    # Basic auth — hamma so'rovlarga
    auth_basic           "efBazaar API — restricted";
    auth_basic_user_file /etc/nginx/auth/swagger.htpasswd;

    # Health probe (auth talab qilmaydi — load balancer/UptimeRobot uchun)
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- Internal auth verify (subrequest target) ----------
    location = /_auth_verify {
        internal;
        auth_basic off;
        proxy_pass http://$backend_auth/api/v1/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Tomcat rejects Host with underscore (RFC-3986). Default $proxy_host
        # would be "auth_upstream" → 400. Override with the caller's host.
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ---------- browser marketplace API ----------
    location /api/ {
        auth_basic off;

        limit_req zone=card_interest burst=4 nodelay;
        limit_req_status 429;

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        auth_request /_auth_verify;
        error_page 401 = @marketplace_anon;

        auth_request_set $user_id      $upstream_http_x_user_id;
        auth_request_set $user_roles   $upstream_http_x_user_roles;
        auth_request_set $telegram_id  $upstream_http_x_telegram_id;
        auth_request_set $user_name    $upstream_http_x_user_name;

        proxy_set_header X-User-Id     $user_id;
        proxy_set_header X-User-Roles  $user_roles;
        proxy_set_header X-Telegram-Id $telegram_id;
        proxy_set_header X-User-Name   $user_name;
        proxy_set_header X-Interest-Network $remote_addr;

        # Pass the exact request URI — with a variable host, nginx does NOT do
        # the location→URI prefix substitution it does with static upstreams,
        # so `.../api/` here would send a fixed `/api/` instead of the caller's
        # `/api/v1/listings?...` and everything 404s.
        proxy_pass http://$backend_marketplace$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location @marketplace_anon {
        auth_basic off;

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept" always;
        add_header Vary "Origin" always;

        # MUHIM: identity headerlarni tozalash — spoofing himoyasi.
        proxy_set_header X-User-Id     "";
        proxy_set_header X-User-Roles  "";
        proxy_set_header X-Telegram-Id "";
        proxy_set_header X-User-Name   "";
        proxy_set_header X-Interest-Network $remote_addr;

        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass http://$backend_marketplace$uri$is_args$args;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ----- trade-service (Plan B lifecycle + human trade-admin) ------
    location ~ ^/api/v1/(trades|mailboxes|cards|trade-admins|admin/mailboxes|admin/trades|admin/trade-admins)(/|$) {
        auth_basic off;

        limit_except GET POST DELETE OPTIONS { deny all; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_allow_origin always;
            add_header Access-Control-Allow-Methods     "GET,POST,DELETE,OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization,Content-Type,Accept" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        auth_request /_auth_verify;
        error_page 401 = @trade_unauth;

        auth_request_set $user_id      $upstream_http_x_user_id;
        auth_request_set $user_roles   $upstream_http_x_user_roles;
        auth_request_set $telegram_id  $upstream_http_x_telegram_id;
        auth_request_set $user_name    $upstream_http_x_user_name;

        proxy_set_header X-User-Id     $user_id;
        proxy_set_header X-User-Roles  $user_roles;
        proxy_set_header X-Telegram-Id $telegram_id;
        proxy_set_header X-User-Name   $user_name;

        proxy_pass http://$backend_trade$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location @trade_unauth {
        auth_basic off;

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        return 401 '{"error":"unauthenticated"}';
    }

    # ----- trade-service WSS --------------------------
    location /ws/trade/ {
        auth_basic off;

        auth_request /_auth_verify;

        auth_request_set $user_id      $upstream_http_x_user_id;
        auth_request_set $user_roles   $upstream_http_x_user_roles;

        proxy_set_header X-User-Id     $user_id;
        proxy_set_header X-User-Roles  $user_roles;
        proxy_set_header Host          $host;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # No timeout on upgraded connection — WSS is long-lived.
        proxy_read_timeout 3600s;

        proxy_pass http://$backend_trade;
    }

    # Root → swagger-ui
    location = / {
        return 302 /swagger-ui/index.html;
    }

    # ---------- Swagger UI (auth-service hostingida) ----------
    location /swagger-ui/ {
        proxy_pass http://$backend_auth$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /swagger-ui.html {
        return 302 /swagger-ui/index.html;
    }
    # Springdoc webjars (CSS/JS)
    location /webjars/ {
        proxy_pass http://$backend_auth$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location /swagger-resources {
        proxy_pass http://$backend_auth$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---------- OpenAPI JSON — har servisning o'zidan ----------
    location = /v3/api-docs/auth {
        proxy_pass http://$backend_auth/v3/api-docs;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /v3/api-docs/marketplace {
        proxy_pass http://$backend_marketplace/v3/api-docs;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /v3/api-docs/bot {
        proxy_pass http://$backend_bot/v3/api-docs;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    # auth-service /v3/api-docs (springdoc swagger-ui meta — top-level config,
    # subpaths like /v3/api-docs/swagger-config used by the UI).
    location /v3/api-docs {
        proxy_pass http://$backend_auth$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}

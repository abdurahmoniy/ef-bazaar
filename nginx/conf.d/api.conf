# ==============================================================
# api.efbazaar.chempox.uz — aggregated Swagger UI
#
# Route table (HTTPS):
#   /                       → /swagger-ui/index.html ga redirect
#   /swagger-ui/**          → auth-service /swagger-ui/** (springdoc-openapi UI)
#   /v3/api-docs/auth        → auth-service /v3/api-docs
#   /v3/api-docs/marketplace → marketplace-service /v3/api-docs
#   /v3/api-docs/bot         → bot /v3/api-docs
#   /healthz                → 200
#
# Hammasi nginx basic auth ostida (htpasswd /etc/nginx/auth/swagger.htpasswd).
# ==============================================================

# ---------- HTTP (80) — ACME + redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.efbazaar.chempox.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (443) — Swagger UI ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.efbazaar.chempox.uz;

    # Single SAN cert ikkala domen uchun (efbazaar + api.efbazaar) — bir joydan o'qiymiz.
    ssl_certificate     /etc/letsencrypt/live/efbazaar.chempox.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/efbazaar.chempox.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # Basic auth — hamma so'rovlarga
    auth_basic           "efBazaar API — restricted";
    auth_basic_user_file /etc/nginx/auth/swagger.htpasswd;

    # Health probe (auth talab qilmaydi — load balancer/UptimeRobot uchun)
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Root → swagger-ui
    location = / {
        return 302 /swagger-ui/index.html;
    }

    # ---------- Swagger UI (auth-service hostingida) ----------
    location /swagger-ui/ {
        proxy_pass http://auth_upstream/swagger-ui/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /swagger-ui.html {
        return 302 /swagger-ui/index.html;
    }
    # Springdoc webjars (CSS/JS)
    location /webjars/ {
        proxy_pass http://auth_upstream/webjars/;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location /swagger-resources {
        proxy_pass http://auth_upstream/swagger-resources;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---------- OpenAPI JSON — har servisning o'zidan ----------
    location = /v3/api-docs/auth {
        proxy_pass http://auth_upstream/v3/api-docs;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /v3/api-docs/marketplace {
        proxy_pass http://marketplace_upstream/v3/api-docs;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    location = /v3/api-docs/bot {
        proxy_pass http://bot_upstream/v3/api-docs;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
    # auth-service /v3/api-docs (springdoc swagger-ui meta — top-level config)
    location /v3/api-docs {
        proxy_pass http://auth_upstream/v3/api-docs;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}

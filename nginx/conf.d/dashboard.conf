# ==============================================================
# dashboard.efbazaar.uz — Grafana (loglar va metrikalar)
#
# IKKI QAVATLI HIMOYA, va ular boshqa-boshqa ish qiladi:
#
#   1. nginx basic auth — tashqi eshik. Skanerlar, botlar va Grafana'da
#      topilgan yangi zaiflik login sahifasiga umuman yetmaydi.
#   2. Grafana'ning o'z login'i — haqiqiy huquq boshqaruvi: foydalanuvchilar,
#      rollar, kimga faqat ko'rish huquqi berilgani.
#
# Birinchisi bitta umumiy parol, ya'ni u KIMLIGINGIZNI bilmaydi — shuning
# uchun u yolg'iz yetarli emas va Grafana login'i olib tashlanmaydi.
#
# NIMANI OCHAYOTGANIMIZNI BILIB TURING: Grafana Loki'ga qaraydi, Loki esa
# hamma servisning 30 kunlik logini saqlaydi — pochta manzillari, savdo
# id'lari, xato matnlari. Ilgari bu SSH kaliti ortida edi. Endi parol
# ortida. Parol generatsiya qilingan bo'lsin, o'ylab topilgan emas.
#
# Prometheus va Loki bu yerda YO'Q va kerak ham emas: Grafana ularga ichki
# docker tarmog'i orqali boradi (infra/grafana/provisioning/datasources)
# va so'rovlarni o'zi proksilaydi.
# ==============================================================

# HTTP → HTTPS redirect + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.efbazaar.uz;

    # Let's Encrypt renewal uchun. Basic auth'DAN TASHQARIDA bo'lishi shart:
    # certbot parol bilmaydi va 401 olsa sertifikat yangilanmay qoladi.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Grafana
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 9080;  # vps-edge Traefik, TLS already terminated
    http2 on;
    server_name dashboard.efbazaar.uz;

    ssl_certificate     /etc/letsencrypt/live/efbazaar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/efbazaar.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # Qidiruv tizimlariga tushmasin.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Backend variables — re-resolved per request via http-level resolver.
    include /etc/nginx/conf.d/backends.inc;

    location / {
        auth_basic           "efBazaar dashboard";
        auth_basic_user_file /etc/nginx/auth/dashboard.htpasswd;

        proxy_pass http://$backend_grafana$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Grafana Live (WebSocket).
    #
    # proxy-common.inc bu yerda ATAYLAB ishlatilmadi: unda
    # `proxy_read_timeout 60s` bor va nginx bir blokda bu direktivani ikki
    # marta ko'rsa umuman ishga tushmaydi ("duplicate" xatosi). WS ulanishi
    # esa soatlab ochiq turadi va 60 soniyada uzilib qolardi, natijada
    # jonli panellar bir daqiqada bir marta "qayta ulanmoqda" bo'lardi.
    # Shuning uchun sarlavhalar shu yerda qo'lda takrorlangan.
    location /api/live/ {
        auth_basic           "efBazaar dashboard";
        auth_basic_user_file /etc/nginx/auth/dashboard.htpasswd;

        proxy_pass http://$backend_grafana$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}

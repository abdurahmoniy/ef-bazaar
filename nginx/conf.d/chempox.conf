# ==============================================================
# chempox.uz — Examiner (alohida loyiha, efBazaar nginx yagona ingress)
#
# Chempionat-X yopildi; chempox.uz, www.chempox.uz va api.chempox.uz endi
# Examiner'niki (github.com/mukhiddinov/examiner). Uning server bloklari shu
# repo'da EMAS — Examiner o'z deploy'i bilan hostdagi /opt/examiner/nginx/site/
# papkasiga yozadi (docker-compose.yml'da /etc/nginx/examiner ga :ro mount),
# `nginx -t` dan o'tsagina reload qiladi.
#
# Papka bo'sh yoki yo'q bo'lsa glob hech narsa topmaydi va nginx odatdagidek
# ko'tariladi — chempox.uz so'rovlarini efbazaar.conf'dagi catch-all 444 bilan
# yopadi. Examiner konteynerlari o'chiq paytda ham nginx yiqilmaydi: upstream'lar
# o'zgaruvchi orqali, so'rov vaqtida resolve qilinadi.
#
# TLS: /etc/letsencrypt/live/chempox.uz/ (chempox.uz + www + api SAN) avvalgidek
# certbot konteyneri tomonidan yangilanadi; Examiner'ning 80-port bloki uchala
# domen uchun /.well-known/acme-challenge/ ni /var/www/certbot dan beradi.
# ==============================================================

include /etc/nginx/examiner/site/*.conf;

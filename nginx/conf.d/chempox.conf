# ==============================================================
# chempox.uz — Chempionat-X (co-location, efBazaar nginx yagona ingress)
#
# Chempionat-X endi efBazaar bilan bir xostda, shared docker network'da.
# Uning o'z nginx'i ISHLAMAYDI — TLS terminatsiya va routing shu yerda.
#
#   chempox.uz / www.chempox.uz  → chempox-front:80   (Next.js static SPA)
#   api.chempox.uz               → chempionat-api:8080 (REST, native JWT auth)
#
# TLS: bitta SAN cert (/etc/letsencrypt/live/chempox.uz/) uchta domenni qamraydi
# (init-cert.sh: chempox.uz + www.chempox.uz + api.chempox.uz).
#
# Diqqat: default_server bu yerda YO'Q — efbazaar.conf'dagi catch-all noma'lum
# Host'larni 444 bilan yopadi. Rate-limit zonalari (api_limit, addr) nginx.conf.
#
# efBazaar user'lari turnirlarga `/api/tournaments/**` (efbazaar.conf) orqali
# kiradi — u header-auth (X-User-Id + X-Internal-Secret) inject qiladi. Bu
# fayl esa Chempionat'ning O'Z domenlari (chempox.uz app + api) uchun; ular
# Chempionat'ning native Telegram-JWT auth'ini ishlatadi, efBazaar auth emas.
# ==============================================================

# ---------- HTTP (80) — ACME challenge + HTTPS redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name chempox.uz www.chempox.uz api.chempox.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (443) — chempox.uz static SPA ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chempox.uz www.chempox.uz;

    ssl_certificate     /etc/letsencrypt/live/chempox.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chempox.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    include /etc/nginx/conf.d/backends.inc;

    # Telegram Mini App uchun iframe embed'ga ruxsat (DENY bo'lsa bo'sh ekran).
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;

    limit_req  zone=api_limit burst=20 nodelay;
    limit_conn addr 20;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # www → naked redirect
    if ($host = www.chempox.uz) {
        return 301 https://chempox.uz$request_uri;
    }

    # Static SPA'ni chempox-front konteyneri xizmat qiladi (cache/try_files
    # o'sha image ichidagi nginx'da). Bu yerda faqat proxy.
    location / {
        proxy_pass http://$backend_chempox_front$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }
}

# ---------- HTTPS (443) — api.chempox.uz REST (native JWT) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.chempox.uz;

    ssl_certificate     /etc/letsencrypt/live/chempox.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chempox.uz/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    include /etc/nginx/conf.d/backends.inc;

    # API hech qachon iframe ichida bo'lmasligi kerak.
    add_header X-Frame-Options DENY always;

    limit_req  zone=api_limit burst=20 nodelay;
    limit_conn addr 20;

    # Multipart screenshot upload uchun katta body.
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Root → Swagger UI (basic auth ortida).
    location = / {
        auth_basic           "ChempoX API — restricted";
        auth_basic_user_file /etc/nginx/auth/swagger.htpasswd;
        return 302 /swagger-ui/index.html;
    }

    # Public API — Chempionat o'zi JWT'ni tekshiradi (nginx levelda auth yo'q).
    location /api/ {
        proxy_pass http://$backend_tournament$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Swagger UI + metadata — basic auth ortida.
    location /swagger-ui/ {
        auth_basic           "ChempoX API — restricted";
        auth_basic_user_file /etc/nginx/auth/swagger.htpasswd;
        proxy_pass http://$backend_tournament$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /v3/api-docs {
        auth_basic           "ChempoX API — restricted";
        auth_basic_user_file /etc/nginx/auth/swagger.htpasswd;
        proxy_pass http://$backend_tournament$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /swagger-resources {
        auth_basic           "ChempoX API — restricted";
        auth_basic_user_file /etc/nginx/auth/swagger.htpasswd;
        proxy_pass http://$backend_tournament$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /webjars/ {
        auth_basic           "ChempoX API — restricted";
        auth_basic_user_file /etc/nginx/auth/swagger.htpasswd;
        proxy_pass http://$backend_tournament$request_uri;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location / {
        return 404;
    }
}

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # 1024 = Docker container default nofile limit.
    # 2GB/1vCPU server uchun kichik MVP trafik bilan yetadi.
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Dynamic DNS resolution — Docker's embedded DNS is at 127.0.0.11.
    # With `valid=10s` nginx re-resolves backend hostnames every 10s, so
    # when a container restarts and gets a new IP nginx picks it up
    # automatically instead of holding the stale IP and returning 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # vps-edge: Traefik (github.com/mukhiddinov/vps-edge) terminates TLS and
    # forwards visitors over the shared `edge` docker network to :9080, the
    # plain-HTTP twin of every :443 server below. Only addresses in that
    # network may name the visitor; Traefik drops any X-Forwarded-For a client
    # sends, so $remote_addr — and every per-IP limit_req below — sees the real
    # visitor. Direct connections (the current :80/:443) are unaffected.
    # Traefik's address only, not the edge subnet: the subnet also holds the
    # docker gateway (the host), from which anything could claim any address.
    set_real_ip_from 172.30.0.2;  # vps-edge EDGE_TRAEFIK_IP (network label vps-edge.traefik-ip)
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # The scheme the visitor used. On :9080 that is what Traefik reports
    # ($scheme there is plain http); everywhere else nginx's own $scheme.
    map "$server_port:$http_x_forwarded_proto" $forwarded_proto {
        default      $scheme;
        "9080:https" https;
        "9080:http"  http;
    }

    # Public blacklist — scraping nishoni: IP boshiga 30 req/min yetarli
    # (sahifa paginatsiyasi bilan ham). Burst=10 qisqa portlashlarni kechiradi.
    limit_req_zone $binary_remote_addr zone=blacklist:1m rate=30r/m;

    # Only card-interest writes use this key; empty map values are not counted.
    # A caller cannot mint identities to inflate demand or exhaust Redis.
    map $request_uri $card_interest_limit_key {
        default "";
        ~^/api/(marketplace/|rec/)?v1/card-interest/apply(\?|$) $binary_remote_addr;
    }
    limit_req_zone $card_interest_limit_key zone=card_interest:1m rate=6r/m;

    # Chempionat-X (chempox.uz / api.chempox.uz — chempox.conf) uchun.
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Telegram media uchun katta body (50MB gacha — Telegram limit)
    client_max_body_size 60M;
    client_body_timeout 60s;
    client_header_timeout 30s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}

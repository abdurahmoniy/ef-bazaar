spring:
  application:
    name: bot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  main:
    web-application-type: servlet

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 80MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: bot
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

server:
  port: 8084
  # Nginx (proxy-common.inc) sends X-Forwarded-Proto/Host — honor them so springdoc
  # generates https://api.efbazaar.uz in OpenAPI servers[] instead of plain http.
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  health:
    kafka:
      enabled: false
  # Javob vaqti uchun histogram bucket'lari — p95/p99 shusiz hisoblanmaydi.
  # Chegaralar bucket sonini jilovlaydi; izoh auth-service'da to'liqroq.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s

app:
  web:
    base-url: ${APP_BASE_URL:https://efbazaar.uz}
  # /start matni va banneri marketplace-service'da saqlanadi — botda DB yo'q.
  # Sir sozlanmagan bo'lsa bot standart matnga tushadi, lekin ishlashda davom
  # etadi: bu bog'liqlik /start ni sindirmasligi kerak.
  auth:
    internal-base-url: ${AUTH_INTERNAL_BASE_URL:http://auth-service:8081}
  # Ommaviy xabar jo'natish tezligi.
  #
  # Telegram turli foydalanuvchilarga sekundiga ~30 xabarga ruxsat beradi.
  # Chegaraga urilish jo'natishni tezlashtirmaydi — faqat 429 va kutish
  # keltiradi, muntazam takrorlansa esa bot bloklanadi.
  #
  # 30 emas, 20: chegara BUTUN BOT uchun umumiy, bu jilov esa faqat ommaviy
  # xabarlarni sanaydi. Bot ayni paytda chat bildirishnomalari, ro'yxatdan
  # o'tish xabarlari va WARN/ERROR loglarini ham yuboradi. Ular shu 30 dan
  # yeydi, lekin bu hisobga kirmaydi — shuning uchun 10 xabarlik zaxira
  # qoldiramiz. 25 da zaxira 5 ta edi va jonli jo'natish paytida yetmasligi
  # mumkin.
  #
  # To'g'ri yechim — botning HAMMA Telegram chaqiruvi uchun umumiy jilov.
  # Foydalanuvchi soni o'sganda o'shanga o'tamiz; hozircha zaxira arzonroq.
  broadcast:
    messages-per-second: ${BROADCAST_MESSAGES_PER_SECOND:20}
    progress-every: ${BROADCAST_PROGRESS_EVERY:50}
  marketplace:
    internal-base-url: ${MARKETPLACE_INTERNAL_BASE_URL:http://marketplace-service:8082}
    # Docker tarmog'idagi servislar bitta umumiy sirni bo'lishadi.
    secret: ${INTERNAL_API_SECRET:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    api-base-url: https://api.telegram.org
    group-chat-id: ${TELEGRAM_GROUP_CHAT_ID:}
    topics:
      logs:         ${TELEGRAM_TOPIC_LOGS:6}
      registration: ${TELEGRAM_TOPIC_REGISTRATION:4}
      media:        ${TELEGRAM_TOPIC_MEDIA:2}
      # No default number: an unset topic means "do not post", not "post into
      # topic 2". The real value is a secret and lives only in .env.
      payments:     ${TELEGRAM_TOPIC_PAYMENTS:}
    webhook-url:    ${TELEGRAM_WEBHOOK_URL:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false      # UI auth-service'da aggregated
  show-actuator: false

logging:
  level:
    root: INFO
    uz.efbazaar: DEBUG

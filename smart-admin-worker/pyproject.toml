[project]
name = "smart-admin-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored automation script — relocated verbatim from upstream; not style-owned here.
extend-exclude = ["smart_admin_worker/konami/rotate/rotate.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008", "N818"]  # FastAPI Depends() shows up in default args; N818 for domain exception naming

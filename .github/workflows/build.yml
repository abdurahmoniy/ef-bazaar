# ==============================================================
# CI — Build & Push Docker images to GHCR
#
# Faqat o'zgargan servislarni build qiladi. Image lar:
#   ghcr.io/<owner>/efbazaar-<service>:latest
#   ghcr.io/<owner>/efbazaar-<service>:<sha>
#
# GHCR cache backend bilan layer cache hit avtomatik.
# Server keyin docker pull qiladi — build emas.
# ==============================================================

name: CI — Build & Push images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild all services regardless of changes"
        required: false
        default: "false"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # GHCR ga push uchun

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/efbazaar

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      auth:           ${{ steps.filter.outputs.auth }}
      marketplace:    ${{ steps.filter.outputs.marketplace }}
      trade:          ${{ steps.filter.outputs.trade }}
      bot:            ${{ steps.filter.outputs.bot }}
      frontend:       ${{ steps.filter.outputs.frontend }}
      mail:           ${{ steps.filter.outputs.mail }}
      nginx:          ${{ steps.filter.outputs.nginx }}
      smart-admin:    ${{ steps.filter.outputs['smart-admin'] }}
      matrix:         ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # `every`: fayl filtrdagi HAMMA pattern'ga mos kelsagina hisoblanadi —
      # `!**/*.md` shu tufayli ishlaydi (hujjat o'zgarishi image qurmaydi).
      # Shu rejimda "servis YOKI build.yml" ni bitta filtrga yozib bo'lmaydi,
      # shuning uchun build.yml o'zgarishi alohida `workflow` filtri va
      # pastda FORCE_ALL bilan bir xil ishlaydi.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            workflow:
              - '.github/workflows/build.yml'
            auth:
              - 'backend/auth-service/**'
              - '!**/*.md'
            marketplace:
              - 'backend/marketplace-service/**'
              - '!**/*.md'
            trade:
              - 'backend/trade-service/**'
              - '!**/*.md'
            payment:
              - 'backend/payment-service/**'
              - '!**/*.md'
            access:
              - 'backend/access-service/**'
              - '!**/*.md'
            bot:
              - 'bot/**'
              - '!**/*.md'
            frontend:
              - 'frontend/**'
              - '!**/*.md'
            mail:
              - 'mail/**'
              - '!**/*.md'
            nginx:
              - 'nginx/**'
              - '!**/*.md'
            smart-admin:
              - 'smart-admin-worker/**'
              - '!**/*.md'
            humo-userbot:
              - 'humo-userbot/**'
              - '!**/*.md'
            libs:
              - 'backend/libs/**'
              - '!**/*.md'

      - id: build-matrix
        env:
          FORCE_ALL: ${{ github.event.inputs.force_all }}
          WORKFLOW_CHANGED: ${{ steps.filter.outputs.workflow }}
        run: |
          # build.yml o'zi o'zgarsa — hammasi qayta quriladi (avvalgidek).
          if [[ "$WORKFLOW_CHANGED" == "true" ]]; then FORCE_ALL=true; fi
          LIBS_CHANGED="${{ steps.filter.outputs.libs }}"
          ITEMS=()
          add() {
            local name="$1" context="$2" file="$3" image="$4"
            ITEMS+=("{\"name\":\"$name\",\"context\":\"$context\",\"file\":\"$file\",\"image\":\"$image\"}")
          }
          changed()    { [[ "$FORCE_ALL" == "true" || "$1" == "true" ]]; }
          uses_libs()  { [[ "$FORCE_ALL" == "true" || "$LIBS_CHANGED" == "true" || "$1" == "true" ]]; }
          if uses_libs "${{ steps.filter.outputs.auth }}";        then add auth-service        backend backend/auth-service/Dockerfile        auth-service;        fi
          if uses_libs "${{ steps.filter.outputs.marketplace }}"; then add marketplace-service backend backend/marketplace-service/Dockerfile marketplace-service; fi
          if uses_libs "${{ steps.filter.outputs.trade }}";       then add trade-service       backend backend/trade-service/Dockerfile       trade-service;       fi
          if uses_libs "${{ steps.filter.outputs.payment }}";     then add payment-service     backend backend/payment-service/Dockerfile     payment-service;     fi
          if changed "${{ steps.filter.outputs.access }}";                 then add access-service     backend/access-service backend/access-service/Dockerfile access-service;     fi
          if changed "${{ steps.filter.outputs.bot }}";                    then add bot                bot                    bot/Dockerfile                    bot;                fi
          if changed "${{ steps.filter.outputs.frontend }}";               then add frontend           frontend               frontend/Dockerfile               frontend;           fi
          if changed "${{ steps.filter.outputs.mail }}";                   then add mail-frontend      mail                   mail/Dockerfile                   mail-frontend;      fi
          if changed "${{ steps.filter.outputs.nginx }}";                  then add nginx              nginx                  nginx/Dockerfile                  nginx;              fi
          if changed "${{ steps.filter.outputs['smart-admin'] }}";         then add smart-admin-worker smart-admin-worker     smart-admin-worker/Dockerfile     smart-admin-worker; fi
          if changed "${{ steps.filter.outputs['humo-userbot'] }}";        then add humo-userbot       humo-userbot           humo-userbot/Dockerfile           humo-userbot;       fi

          if [ ${#ITEMS[@]} -eq 0 ]; then
            MATRIX='{"include":[]}'
          else
            JOINED=$(IFS=,; echo "${ITEMS[*]}")
            MATRIX="{\"include\":[$JOINED]}"
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $MATRIX"

  build:
    name: Build ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image namespace
        id: ns
        run: echo "ns=$(echo '${{ env.IMAGE_NAMESPACE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.ns }}-${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.ns.outputs.ns }}-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

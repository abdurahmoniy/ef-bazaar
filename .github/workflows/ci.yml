# ==============================================================
# CI — Pull request va main ga push da ishlaydi.
# O'zgargan servisni aniqlaydi va faqat shu servis testlarini ishga tushiradi.
# ==============================================================

name: CI

# Faqat PR paytida — main'ga merge bo'lganda build.yml o'zi run qiladi (test pass'siz merge bo'lmaydi).
# Bu workflow ikki marta ishlamasligi uchun `push: main` triggeri olib tashlandi.
on:
  pull_request:
    branches: [main]

# Bir PR'ga ko'p commit kelsa, oldingi run cancel qilinadi (resurs tejash)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read      # oxirgi muvaffaqiyatli run'ni topish uchun

jobs:
  # Bir job — ikki tekshiruv. Ilgari `guard-migrations` va `detect` alohida
  # runner so'rar edi va ikkalasi ham GitHub'ning runner navbatida qotib
  # qolar edi. Bitta runner'ga siqib olsak, 50% kamroq assignment kutamiz.
  #
  #   1) Flyway append-only guard — V*__*.sql edit/delete/rename PR'ni bloklaydi.
  #      Prior-blob restore uchun istisno: agar fayl content'i ilgari kommit'da
  #      bo'lgan blobga aynan mos kelsa, edit qabul qilinadi (Azizbek allaqachon
  #      applied V-faylni edit qildi → uni prod checksum'iga qaytarish uchun).
  #   2) Path filter — o'zgargan servisni aniqlaydi (test-java, test-frontend
  #      uchun input).
  #
  # Guard step fail bo'lsa job fail bo'ladi va downstream testlar skip bo'ladi
  # — fast-fail, chunki checksum yiqilgan bo'lsa test ma'lumoti keraksiz.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      trade: ${{ steps.filter.outputs.trade }}
      payment: ${{ steps.filter.outputs.payment }}
      access: ${{ steps.filter.outputs.access }}
      recommendation: ${{ steps.filter.outputs.recommendation }}
      bot: ${{ steps.filter.outputs.bot }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mail: ${{ steps.filter.outputs.mail }}
      smart-admin: ${{ steps.filter.outputs['smart-admin'] }}
      userbot-service: ${{ steps.filter.outputs['userbot-service'] }}
      libs: ${{ steps.filter.outputs.libs }}
      # Matritsalar SHU YERDA quriladi, matrisa ichida `if` bilan emas.
      #
      # Statik matritsa har servis uchun job yaratadi, hatto o'sha servis
      # o'zgarmagan bo'lsa ham. Qadamlari o'tkazib yuborilgan job baribir
      # runner oladi va GitHub uni MINIMAL 1 DAQIQA deb hisoblaydi. Har
      # run'da 10 ta job chiqib, 1378 daqiqa 1240 ta jobga taqsimlangan —
      # ya'ni o'rtacha 1.1 daqiqa. Haqiqiy ish 1 daqiqada tugamaydi;
      # sarfning katta qismi bo'sh joblarning eng kam to'lovi bo'lgan.
      #
      # Dinamik matritsa o'zgarmagan servis uchun jobni UMUMAN yaratmaydi.
      # build.yml allaqachon shunday ishlaydi.
      java-matrix: ${{ steps.matrices.outputs.java }}
      python-matrix: ${{ steps.matrices.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # guard-migrations three-dot diff'i uchun kerak
      - name: Ensure migrations are append-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-status --find-renames "$BASE_SHA...HEAD" \
                    -- 'backend/*/src/main/resources/db/migration/V*__*.sql')
          if [ -z "$CHANGED" ]; then
            echo "No migration changes."
            exit 0
          fi
          # 'A<TAB>path'  → adding a new migration is the only accepted change.
          # 'M<TAB>path'  → edits break checksum, UNLESS the resulting blob
          #                 is byte-identical to a previously-committed blob
          #                 at the same path (restore-to-prior-content, which
          #                 is exactly what Flyway needs when a prior PR
          #                 mutated a file in place and prod refuses to boot).
          # 'D<TAB>path'  → deleting an applied file leaves the DB with a version we can't validate.
          # 'R<score>...' → renaming shifts the version number (or filename Flyway hashes).
          FAIL=0
          while IFS=$'\t' read -r status path; do
            [ -z "$status" ] && continue
            case "$status" in
              A) continue ;;
              M)
                CURR_BLOB=$(git rev-parse "HEAD:$path")
                MATCH=$(git log --format=%H "$BASE_SHA" -- "$path" | while read c; do
                          git rev-parse "$c:$path" 2>/dev/null
                        done | grep -Fx "$CURR_BLOB" | head -n1)
                if [ -n "$MATCH" ]; then
                  echo "restore OK — $path ← historical blob $CURR_BLOB"
                  continue
                fi
                echo "::error::$path edited (checksum will diverge from prod). Migrations are append-only."
                FAIL=1
                ;;
              D)
                # Butun servis o'chirilayotgan bo'lsa ruxsat.
                #
                # Guard checksum mos kelmasligidan himoya qiladi: Flyway
                # allaqachon qo'llagan faylni yo'qotsa, u bazadagi versiyani
                # tekshira olmaydi va deploy yiqiladi. Lekin servis butunlay
                # ketayotgan bo'lsa, o'sha migratsiyani o'qiydigan Flyway ham
                # qolmaydi — himoya qiladigan narsa yo'q.
                #
                # "Butun servis" mezoni — uning pom.xml i ham shu diff'da
                # o'chirilgan. Bitta migratsiyani yakka o'zini o'chirish
                # avvalgidek taqiqlangan.
                svc_dir=$(printf "%s" "$path" | sed -E 's|^(backend/[^/]+)/.*|\1|')
                if git diff --name-status "$BASE_SHA...HEAD" -- "$svc_dir/pom.xml" \
                     | grep -q '^D'; then
                  echo "service removal OK — $svc_dir/pom.xml ham o'chirilgan"
                  continue
                fi
                echo "::error::$path deleted (Flyway bazadagi versiyani tekshira olmaydi)."
                FAIL=1
                ;;
              *)
                echo "::error::$path status=$status not allowed."
                FAIL=1
                ;;
            esac
          done < <(printf "%s\n" "$CHANGED")
          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
          echo "OK."
          printf "%s\n" "$CHANGED"
      # Path filter — o'zgargan servisni aniqlaydi.
      # Ilgari dorny/paths-filter@v3 ishlatilar edi, lekin u GitHub'ning
      # `GET /repos/{}/{}/pulls/{n}/files` API'iga tayanadi va API vaqti-vaqti
      # bilan 500 (Unicorn) qaytaradi — PR bloklanib qoladi. Endi to'g'ridan-
      # to'g'ri git diff bilan hisoblaymiz — fetch-depth: 0 allaqachon o'rnatilgan
      # (yuqorida migration guard uchun).
      # Qayerdan boshlab solishtirish kerakligini aniqlaydi.
      #
      # Sukut bo'yicha PR butunlay main bilan solishtiriladi. Uzoq yashaydigan
      # branch'da bu "bir marta tekkan har bir servis har push'da qayta test
      # qilinadi" degani — bir hafta oldin o'zgargan va o'shanda yashil bo'lgan
      # servis ham har safar runner oladi.
      #
      # Shuning uchun boshlang'ich nuqta — shu branch'da CI MUVAFFAQIYATLI
      # o'tgan eng oxirgi commit. Undan beri fayllari qimirlamagan servis
      # allaqachon aynan shu kod bilan tekshirilgan.
      #
      # Nega "oldingi push" (github.event.before) emas: yuqorida
      # cancel-in-progress: true turibdi. Ketma-ket ikki push qilinsa birinchi
      # run bekor qilinadi, va o'sha commit'dagi o'zgarishlar hech qachon
      # test qilinmagan bo'ladi — oldingi push'dan solishtirsak, ular jimgina
      # o'tib ketardi. Tugagan va yashil bo'lgan run esa haqiqiy kafolat.
      #
      # Topilmasa (birinchi run, tarix tozalangan) main'ga qaytamiz — ya'ni
      # xatolik tomoni doim "ko'proq test qilish".
      - name: Find the last commit this branch was green at
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          baseline=""
          # Workflow'ning o'zi yoki umumiy infra o'zgarsa — hech nimaga
          # ishonmaymiz, to'liq PR qayta tekshiriladi.
          if git diff --name-only "$BASE_SHA...HEAD" \
               | grep -qE '^(\.github/|docker-compose\.yml|infra/)'; then
            echo "CI/infra changed — testing the whole PR"
          else
            # Bitta sahifa yetadi: bizga eng yangi ajdod kerak, hammasi emas.
            # --paginate bilan bo'lsa gavjum repoda yuzlab run varaqlanardi.
            shas=$(gh api \
                     "repos/$REPO/actions/workflows/ci.yml/runs?branch=$BRANCH&status=success&per_page=30" \
                     --jq '.workflow_runs[].head_sha' 2>/dev/null || true)
            for sha in $shas; do
              if git cat-file -e "${sha}^{commit}" 2>/dev/null \
                 && git merge-base --is-ancestor "$sha" HEAD; then
                baseline="$sha"
                break
              fi
            done
          fi
          if [ -n "$baseline" ]; then
            echo "Comparing against last green commit $baseline"
          else
            baseline="$BASE_SHA"
            echo "No usable green run — comparing against main"
          fi
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"

      - name: Detect changed services via git
        id: filter
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          # Markdown hech bir servisning build'iga kirmaydi (README, CLAUDE.md,
          # docs/). Faqat hujjat o'zgargan servis uchun test job ochilmaydi.
          files=$(git diff --name-only "$BASE_SHA...HEAD" | grep -v '\.md$' || true)
          echo "Changed files (markdown excluded):"
          printf "%s\n" "$files"
          set_output() {
            local name="$1" prefix="$2"
            if printf "%s\n" "$files" | grep -q "^$prefix"; then
              echo "$name=true"  >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }
          set_output auth           'backend/auth-service/'
          set_output marketplace    'backend/marketplace-service/'
          set_output trade          'backend/trade-service/'
          set_output payment        'backend/payment-service/'
          set_output access         'backend/access-service/'
          set_output recommendation 'backend/recommendation-service/'
          set_output bot            'bot/'
          set_output frontend       'frontend/'
          set_output mail           'mail/'
          set_output smart-admin    'smart-admin-worker/'
          set_output userbot-service 'userbot-service/'
          set_output libs           'backend/libs/'

      # Faqat o'zgargan servislardan matritsa yig'iladi.
      #
      # `if` ni matritsa QADAMLARIGA qo'yish jobni to'xtatmaydi — u baribir
      # yaratiladi, runner oladi va minimal 1 daqiqa hisoblanadi. Bu yerda
      # esa o'zgarmagan servis matritsaga umuman tushmaydi, ya'ni job
      # mavjud ham bo'lmaydi.
      #
      # Shakl build.yml dagi bilan bir xil — ikkalasi bir xil savolga
      # javob beradi va ular ajralib ketmasligi kerak.
      - name: Build test matrices
        id: matrices
        run: |
          emit() {
            local out="$1"; shift
            if [ "$#" -eq 0 ]; then
              echo "$out={\"include\":[]}" >> "$GITHUB_OUTPUT"
            else
              local joined; joined=$(IFS=,; echo "$*")
              echo "$out={\"include\":[$joined]}" >> "$GITHUB_OUTPUT"
            fi
          }

          LIBS="${{ steps.filter.outputs.libs }}"
          JAVA=()
          add_java() { JAVA+=("{\"name\":\"$1\",\"path\":\"$2\"}"); }
          if [ "$LIBS" = "true" ]; then add_java outbox-lib backend/libs/outbox; fi
          if [ "${{ steps.filter.outputs.auth }}" = "true" ] || [ "$LIBS" = "true" ]; then add_java auth-service        backend/auth-service; fi
          if [ "${{ steps.filter.outputs.marketplace }}" = "true" ] || [ "$LIBS" = "true" ]; then add_java marketplace-service backend/marketplace-service; fi
          if [ "${{ steps.filter.outputs.trade }}" = "true" ] || [ "$LIBS" = "true" ]; then add_java trade-service       backend/trade-service; fi
          if [ "${{ steps.filter.outputs.payment }}" = "true" ] || [ "$LIBS" = "true" ]; then add_java payment-service     backend/payment-service; fi
          if [ "${{ steps.filter.outputs.access }}" = "true" ]; then add_java access-service      backend/access-service; fi
          if [ "${{ steps.filter.outputs.recommendation }}" = "true" ]; then add_java recommendation-service backend/recommendation-service; fi
          if [ "${{ steps.filter.outputs.bot }}" = "true" ]; then add_java bot                 bot; fi
          emit java "${JAVA[@]}"

          PY=()
          add_py() { PY+=("{\"name\":\"$1\",\"path\":\"$2\",\"package\":\"$3\",\"image_check\":$4}"); }
          if [ "${{ steps.filter.outputs['smart-admin'] }}" = "true" ]; then add_py smart-admin-worker smart-admin-worker smart_admin_worker false; fi
          if [ "${{ steps.filter.outputs['userbot-service'] }}" = "true" ]; then add_py userbot-service userbot-service userbot_service true; fi
          emit python "${PY[@]}"

          cat "$GITHUB_OUTPUT"

  test-java:
    needs: precheck
    if: needs.precheck.outputs.java-matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.precheck.outputs.java-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install shared libraries
        run: mvn -B -ntp -f backend/libs/outbox/pom.xml install -DskipTests
      - name: Build & test ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        run: mvn -B -ntp verify

  # Matrix, same shape as test-java: one entry per Python service, each gated
  # on its own path filter so an unrelated PR skips it.
  test-python:
    needs: precheck
    if: needs.precheck.outputs.python-matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.precheck.outputs.python-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements-dev.txt
      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        working-directory: ${{ matrix.path }}
        run: ruff check ${{ matrix.package }}/ tests/
      - name: Pytest
        working-directory: ${{ matrix.path }}
        run: pytest -q
      # Pytest passing proves nothing about the image. The runner ships a C
      # compiler and python:*-slim does not, so a dependency with no wheel for
      # our Python installs fine here and dies in the Dockerfile — which is
      # exactly how a red build reached main (TgCrypto, cp311 wheels only).
      # Building on the PR is the only step that runs pip in the environment
      # the container actually gets.
      #
      # smart-admin-worker opts out: its base is the ~2.5GB MS Playwright image,
      # so every PR touching it would pull that before doing anything useful. I
      # could not verify that build end to end, and shipping an unverified step
      # would turn somebody else's PRs red. Flip its flag once someone has.
      - if: matrix.image_check == true
        name: Docker build
        working-directory: ${{ matrix.path }}
        run: docker build -t ${{ matrix.name }}:ci .

  test-frontend:
    needs: precheck
    if: needs.precheck.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # Vitest ilgari CI'da umuman ishlamas edi — faqat Build bor edi. Shuning
      # uchun 37a1d36 eskirgan test bilan main'ga o'tib ketdi va hech kim
      # sezmadi. 440+ test yozilgan, ular hech nimani himoya qilmasa ma'nosiz.
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  test-mail:
    needs: precheck
    if: needs.precheck.outputs.mail == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mail/package-lock.json
      - name: Install
        working-directory: mail
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: mail
        run: npm run test
      - name: Build
        working-directory: mail
        run: npm run build

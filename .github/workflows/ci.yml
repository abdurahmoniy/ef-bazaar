# ==============================================================
# CI — Pull request va main ga push da ishlaydi.
# O'zgargan servisni aniqlaydi va faqat shu servis testlarini ishga tushiradi.
# ==============================================================

name: CI

# Faqat PR paytida — main'ga merge bo'lganda build.yml o'zi run qiladi (test pass'siz merge bo'lmaydi).
# Bu workflow ikki marta ishlamasligi uchun `push: main` triggeri olib tashlandi.
on:
  pull_request:
    branches: [main]

# Bir PR'ga ko'p commit kelsa, oldingi run cancel qilinadi (resurs tejash)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Flyway applied migration'ni o'zgartirish taqiqlangan — checksum mismatch bilan
  # prod deploy'ni yiqadi. Ushbu guard PR'da V*__*.sql o'zgargan/o'chirilgan/nom
  # o'zgargan bo'lsa fail qiladi. Schema o'zgarishi doim YANGI V<n>__ migration'da.
  guard-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure migrations are append-only
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-status --find-renames "$BASE...HEAD" \
                    -- 'backend/*/src/main/resources/db/migration/V*__*.sql')
          if [ -z "$CHANGED" ]; then
            echo "No migration changes."
            exit 0
          fi
          # 'A<TAB>path'  → adding a new migration is the only accepted change.
          # 'M<TAB>path'  → edits to an applied file break checksum on next deploy.
          # 'D<TAB>path'  → deleting an applied file leaves the DB with a version we can't validate.
          # 'R<score>...' → renaming shifts the version number (or filename Flyway hashes).
          BAD=$(printf "%s\n" "$CHANGED" | awk '$1 !~ /^A/')
          if [ -n "$BAD" ]; then
            echo "::error::Flyway migrations are append-only. Schema changes must land in a NEW V<n>__ file, never edited in place."
            printf "%s\n" "$BAD"
            exit 1
          fi
          echo "OK — only additions:"
          printf "%s\n" "$CHANGED"

  detect:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      recommendation: ${{ steps.filter.outputs.recommendation }}
      bot: ${{ steps.filter.outputs.bot }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'backend/auth-service/**'
            marketplace:
              - 'backend/marketplace-service/**'
            recommendation:
              - 'backend/recommendation-service/**'
            bot:
              - 'bot/**'
            frontend:
              - 'frontend/**'

  test-java:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            path: backend/auth-service
            changed: ${{ needs.detect.outputs.auth }}
          - name: marketplace-service
            path: backend/marketplace-service
            changed: ${{ needs.detect.outputs.marketplace }}
          - name: recommendation-service
            path: backend/recommendation-service
            changed: ${{ needs.detect.outputs.recommendation }}
          - name: bot
            path: bot
            changed: ${{ needs.detect.outputs.bot }}
    steps:
      - if: matrix.changed == 'true'
        uses: actions/checkout@v4
      - if: matrix.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: matrix.changed == 'true'
        name: Build & test ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        run: mvn -B -ntp verify

  test-frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build

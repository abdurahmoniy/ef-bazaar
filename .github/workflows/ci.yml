# ==============================================================
# CI — Pull request va main ga push da ishlaydi.
# O'zgargan servisni aniqlaydi va faqat shu servis testlarini ishga tushiradi.
# ==============================================================

name: CI

# Faqat PR paytida — main'ga merge bo'lganda build.yml o'zi run qiladi (test pass'siz merge bo'lmaydi).
# Bu workflow ikki marta ishlamasligi uchun `push: main` triggeri olib tashlandi.
on:
  pull_request:
    branches: [main]

# Bir PR'ga ko'p commit kelsa, oldingi run cancel qilinadi (resurs tejash)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Flyway applied migration'ni o'zgartirish taqiqlangan — checksum mismatch bilan
  # prod deploy'ni yiqadi. Ushbu guard PR'da V*__*.sql o'zgargan/o'chirilgan/nom
  # o'zgargan bo'lsa fail qiladi. Schema o'zgarishi doim YANGI V<n>__ migration'da.
  guard-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure migrations are append-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # fetch-depth: 0 already pulled full history above; the PR event
          # exposes the base commit SHA directly. A shallow fetch here would
          # break the merge-base for the three-dot diff.
          CHANGED=$(git diff --name-status --find-renames "$BASE_SHA...HEAD" \
                    -- 'backend/*/src/main/resources/db/migration/V*__*.sql')
          if [ -z "$CHANGED" ]; then
            echo "No migration changes."
            exit 0
          fi
          # 'A<TAB>path'  → adding a new migration is the only accepted change.
          # 'M<TAB>path'  → edits break checksum, UNLESS the resulting blob
          #                 is byte-identical to a previously-committed blob
          #                 at the same path (restore-to-prior-content, which
          #                 is exactly what Flyway needs when a prior PR
          #                 mutated a file in place and prod refuses to boot).
          # 'D<TAB>path'  → deleting an applied file leaves the DB with a version we can't validate.
          # 'R<score>...' → renaming shifts the version number (or filename Flyway hashes).
          FAIL=0
          while IFS=$'\t' read -r status path; do
            [ -z "$status" ] && continue
            case "$status" in
              A) continue ;;
              M)
                # Is HEAD's blob for $path identical to any prior commit's blob at $path?
                CURR_BLOB=$(git rev-parse "HEAD:$path")
                MATCH=$(git log --format=%H "$BASE_SHA" -- "$path" | while read c; do
                          git rev-parse "$c:$path" 2>/dev/null
                        done | grep -Fx "$CURR_BLOB" | head -n1)
                if [ -n "$MATCH" ]; then
                  echo "restore OK — $path ← historical blob $CURR_BLOB"
                  continue
                fi
                echo "::error::$path edited (checksum will diverge from prod). Migrations are append-only."
                FAIL=1
                ;;
              *)
                echo "::error::$path status=$status not allowed."
                FAIL=1
                ;;
            esac
          done < <(printf "%s\n" "$CHANGED")
          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
          echo "OK."
          printf "%s\n" "$CHANGED"

  detect:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      recommendation: ${{ steps.filter.outputs.recommendation }}
      bot: ${{ steps.filter.outputs.bot }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'backend/auth-service/**'
            marketplace:
              - 'backend/marketplace-service/**'
            recommendation:
              - 'backend/recommendation-service/**'
            bot:
              - 'bot/**'
            frontend:
              - 'frontend/**'

  test-java:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            path: backend/auth-service
            changed: ${{ needs.detect.outputs.auth }}
          - name: marketplace-service
            path: backend/marketplace-service
            changed: ${{ needs.detect.outputs.marketplace }}
          - name: recommendation-service
            path: backend/recommendation-service
            changed: ${{ needs.detect.outputs.recommendation }}
          - name: bot
            path: bot
            changed: ${{ needs.detect.outputs.bot }}
    steps:
      - if: matrix.changed == 'true'
        uses: actions/checkout@v4
      - if: matrix.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: matrix.changed == 'true'
        name: Build & test ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        run: mvn -B -ntp verify

  test-frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build

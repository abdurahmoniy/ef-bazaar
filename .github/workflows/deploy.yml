# ==============================================================
# CD — Selective Deploy (pull-based, simplified)
#
# Server faqat docker pull qiladi va kontaynerlarni qayta yaratadi.
# Image lar avval CI (build.yml) tomonidan GHCR'ga push qilingan.
#
# Trigger:
#   - build.yml SUCCESS bo'lganda avtomatik (workflow_run)
#   - manual workflow_dispatch
#
# Strategiya:
#   - Hamma servisni docker compose pull qiladi (image yangimi yo'qmi —
#     docker o'zi aniqlaydi, faqat sha o'zgargan image'larni qayta yuklaydi).
#   - Hamma servisni docker compose up -d --no-deps qiladi. Image'i o'zgarmagan
#     kontaynerlar tinch qoladi (no-op), o'zgarganlari recreate bo'ladi.
# ==============================================================

name: CD — Selective Deploy

on:
  workflow_run:
    workflows: ["CI — Build & Push images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to pull (default: latest)"
        required: false
        default: "latest"

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    # workflow_run paytida — faqat build muvaffaqiyatli o'tgan bo'lsa.
    # workflow_dispatch paytida — har doim ishlaydi.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          debug: false
          command_timeout: 15m
          envs: DEPLOY_PATH,GH_TOKEN,GH_ACTOR,IMAGE_TAG,POSTGRES_PASSWORD,REDIS_PASSWORD,JWT_SECRET,APP_BASE_URL,TELEGRAM_BOT_TOKEN,TELEGRAM_BOT_USERNAME,TELEGRAM_GROUP_CHAT_ID,OFFICIAL_CHANNEL,TELEGRAM_TOPIC_LOGS,TELEGRAM_TOPIC_REGISTRATION,TELEGRAM_TOPIC_MEDIA,TELEGRAM_TOPIC_PAYMENTS,TELEGRAM_TOPIC_EMAIL,TELEGRAM_TOPIC_SUPPORT,TELEGRAM_TOPIC_HEALTH,TELEGRAM_TOPIC_BACKUPS,TELEGRAM_WEBHOOK_URL,TELEGRAM_WEBHOOK_SECRET,TELEGRAM_API_ID,TELEGRAM_API_HASH,HUMO_SOURCE_CHAT,NGINX_HTTP_PORT,NGINX_HTTPS_PORT,GOOGLE_CLIENT_ID,OPS_BOT_TOKEN,BACKUP_PASSPHRASE,MAILCOW_API_KEY,INTERNAL_API_SECRET,CARD_INTEREST_HMAC_SECRET,GRAFANA_ADMIN_PASSWORD,FIREBASE_WEB_API_KEY,FIREBASE_PROJECT_ID,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_WEB_APP_ID,FIREBASE_WEB_VAPID_KEY,FIREBASE_PUSH_ENABLED,FIREBASE_CREDENTIALS_FILE,USER_ACCOUNT_BACKFILL_ENABLED
          script: |
            LOG=/tmp/efbazaar-deploy-latest.log
            cd "${DEPLOY_PATH:-/opt/efbazaar}"
            echo "=== pulling latest code ==="
            git -c "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf=https://github.com/" \
                -c "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf=git@github.com:" \
                fetch --all
            git reset --hard origin/main
            echo "=== running deploy.sh (smart — only changed services recreate) ==="
            bash deploy.sh > "$LOG" 2>&1
            STATUS=$?
            echo "=== deploy.sh exit status: $STATUS ==="
            echo "=== last 150 lines of log ==="
            tail -150 "$LOG" || echo "(log file missing)"
            exit $STATUS
        env:
          DEPLOY_PATH:    ${{ secrets.DEPLOY_PATH }}
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR:       ${{ github.actor }}
          IMAGE_TAG:      ${{ github.event.inputs.image_tag || 'latest' }}
          POSTGRES_PASSWORD:           ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD:              ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET:                  ${{ secrets.JWT_SECRET }}
          CARD_INTEREST_HMAC_SECRET: ${{ secrets.CARD_INTEREST_HMAC_SECRET }}
          APP_BASE_URL:                ${{ secrets.APP_BASE_URL }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME:       ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_GROUP_CHAT_ID:      ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          # efBazaar rasmiy kanali (@EfBazaar yoki raqamli id) — har bir
          # e'lon shu yerga ham tushadi. Yuqoridagi envs: ro'yxatida ham
          # turishi shart.
          OFFICIAL_CHANNEL:            ${{ secrets.OFFICIAL_CHANNEL }}
          TELEGRAM_TOPIC_LOGS:         ${{ secrets.TELEGRAM_TOPIC_LOGS }}
          TELEGRAM_TOPIC_REGISTRATION: ${{ secrets.TELEGRAM_TOPIC_REGISTRATION }}
          TELEGRAM_TOPIC_MEDIA:        ${{ secrets.TELEGRAM_TOPIC_MEDIA }}
          # Thread id of the admin group's payments topic — a secret, like every
          # other Telegram identifier here. Must appear in the envs: list above
          # as well; a name missing there never reaches the server.
          TELEGRAM_TOPIC_PAYMENTS:     ${{ secrets.TELEGRAM_TOPIC_PAYMENTS }}
          TELEGRAM_TOPIC_EMAIL:        ${{ secrets.TELEGRAM_TOPIC_EMAIL }}
          TELEGRAM_TOPIC_SUPPORT:      ${{ secrets.TELEGRAM_TOPIC_SUPPORT }}
          # Grafana admin paroli. Bu yerda BO'LMASA deploy.sh o'zining
          # `${GRAFANA_ADMIN_PASSWORD:-admin}` default'iga tushadi va
          # parol literal "admin" bo'lib qoladi. Grafana loopback'da
          # turganda bu chidasa bo'lardi; dashboard.efbazaar.uz ochilgach
          # yo'q. envs: ro'yxatida ham turishi shart.
          GRAFANA_ADMIN_PASSWORD:      ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TELEGRAM_WEBHOOK_URL:        ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_WEBHOOK_SECRET:     ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          # humo-userbot — MTProto user-session credentials from my.telegram.org.
          # Must appear in the envs: list above as well; a name missing there
          # never reaches the server even with the entry here.
          TELEGRAM_API_ID:             ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:           ${{ secrets.TELEGRAM_API_HASH }}
          HUMO_SOURCE_CHAT:            ${{ secrets.HUMO_SOURCE_CHAT }}
          NGINX_HTTP_PORT:             ${{ secrets.NGINX_HTTP_PORT }}
          NGINX_HTTPS_PORT:            ${{ secrets.NGINX_HTTPS_PORT }}
          GOOGLE_CLIENT_ID:            ${{ secrets.GOOGLE_CLIENT_ID }}
          # Bir martalik "Akkountlarim" ta'miri. Bu yerda BO'LMASA .env ga
          # yozilmaydi va compose'ning `false` defaulti ishlaydi, ya'ni ta'mir
          # jimgina o'tkazib yuboriladi. envs: ro'yxatida ham turishi shart.
          USER_ACCOUNT_BACKFILL_ENABLED: ${{ secrets.USER_ACCOUNT_BACKFILL_ENABLED }}
          # Host-level ops-bot (infra/ops-bot) — /logs + /health uchun alohida token
          OPS_BOT_TOKEN:               ${{ secrets.OPS_BOT_TOKEN }}
          TELEGRAM_TOPIC_HEALTH:       ${{ secrets.TELEGRAM_TOPIC_HEALTH }}
          TELEGRAM_TOPIC_BACKUPS:      ${{ secrets.TELEGRAM_TOPIC_BACKUPS }}
          # DB backup — AES-256 passphrase (CRITICAL: yo'qotsangiz restore imkonsiz)
          BACKUP_PASSPHRASE:           ${{ secrets.BACKUP_PASSPHRASE }}
          # Mailcow admin API key — smart-admin-worker uses this to create/rotate mailboxes.
          MAILCOW_API_KEY:             ${{ secrets.MAILCOW_API_KEY }}
          # Chempionat-X integration shared secret (nginx X-Internal-Secret +
          # auth/marketplace /internal guard). Must equal Chempionat's EFBAZAAR_INTERNAL_SECRET.
          INTERNAL_API_SECRET:         ${{ secrets.INTERNAL_API_SECRET }}
          # Firebase web configuration and server-side credential file path.
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
          FIREBASE_PUSH_ENABLED: ${{ secrets.FIREBASE_PUSH_ENABLED }}
          FIREBASE_CREDENTIALS_FILE: ${{ secrets.FIREBASE_CREDENTIALS_FILE }}

# ==============================================================
# CD — Selective Deploy (pull-based, simplified)
#
# Server faqat docker pull qiladi va kontaynerlarni qayta yaratadi.
# Image lar avval CI (build.yml) tomonidan GHCR'ga push qilingan.
#
# Trigger:
#   - build.yml SUCCESS bo'lganda avtomatik (workflow_run)
#   - manual workflow_dispatch
#
# Strategiya:
#   - Hamma servisni docker compose pull qiladi (image yangimi yo'qmi —
#     docker o'zi aniqlaydi, faqat sha o'zgargan image'larni qayta yuklaydi).
#   - Hamma servisni docker compose up -d --no-deps qiladi. Image'i o'zgarmagan
#     kontaynerlar tinch qoladi (no-op), o'zgarganlari recreate bo'ladi.
# ==============================================================

name: CD — Selective Deploy

on:
  workflow_run:
    workflows: ["CI — Build & Push images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to pull (default: latest)"
        required: false
        default: "latest"

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    # workflow_run paytida — faqat build muvaffaqiyatli o'tgan bo'lsa.
    # workflow_dispatch paytida — har doim ishlaydi.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          debug: true
          command_timeout: 15m
          envs: DEPLOY_PATH,GH_TOKEN,GH_ACTOR,IMAGE_TAG,POSTGRES_PASSWORD,REDIS_PASSWORD,JWT_SECRET,APP_BASE_URL,TELEGRAM_BOT_TOKEN,TELEGRAM_BOT_USERNAME,TELEGRAM_GROUP_CHAT_ID,TELEGRAM_TOPIC_LOGS,TELEGRAM_TOPIC_REGISTRATION,TELEGRAM_TOPIC_MEDIA,TELEGRAM_WEBHOOK_URL,NGINX_HTTP_PORT,NGINX_HTTPS_PORT,GOOGLE_CLIENT_ID,OPS_BOT_TOKEN
          script: |
            LOG=/tmp/efbazaar-deploy-latest.log
            cd "${DEPLOY_PATH:-/opt/efbazaar}"
            echo "=== pulling latest code ==="
            git -c "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf=https://github.com/" \
                -c "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf=git@github.com:" \
                fetch --all
            git reset --hard origin/main
            echo "=== running deploy.sh (smart — only changed services recreate) ==="
            bash deploy.sh > "$LOG" 2>&1
            STATUS=$?
            echo "=== deploy.sh exit status: $STATUS ==="
            echo "=== last 150 lines of log ==="
            tail -150 "$LOG" || echo "(log file missing)"
            exit $STATUS
        env:
          DEPLOY_PATH:    ${{ secrets.DEPLOY_PATH }}
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR:       ${{ github.actor }}
          IMAGE_TAG:      ${{ github.event.inputs.image_tag || 'latest' }}
          POSTGRES_PASSWORD:           ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD:              ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET:                  ${{ secrets.JWT_SECRET }}
          APP_BASE_URL:                ${{ secrets.APP_BASE_URL }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME:       ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_GROUP_CHAT_ID:      ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          TELEGRAM_TOPIC_LOGS:         ${{ secrets.TELEGRAM_TOPIC_LOGS }}
          TELEGRAM_TOPIC_REGISTRATION: ${{ secrets.TELEGRAM_TOPIC_REGISTRATION }}
          TELEGRAM_TOPIC_MEDIA:        ${{ secrets.TELEGRAM_TOPIC_MEDIA }}
          TELEGRAM_WEBHOOK_URL:        ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          NGINX_HTTP_PORT:             ${{ secrets.NGINX_HTTP_PORT }}
          NGINX_HTTPS_PORT:            ${{ secrets.NGINX_HTTPS_PORT }}
          GOOGLE_CLIENT_ID:            ${{ secrets.GOOGLE_CLIENT_ID }}
          # Host-level ops-bot (infra/ops-bot) — /logs uchun alohida token
          OPS_BOT_TOKEN:               ${{ secrets.OPS_BOT_TOKEN }}

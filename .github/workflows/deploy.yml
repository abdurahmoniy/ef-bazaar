# ==============================================================
# Deploy — main ga push da ishlaydi.
# Faqat o'zgargan servislarni qayta build qiladi va restart qiladi (--no-deps).
# .env serverga GitHub Secrets dan har deploy paytida yangilanadi.
#
# Required GitHub secrets:
#   ──── Deploy ────
#   DEPLOY_HOST          — serverning IP/domain
#   DEPLOY_USER          — SSH user
#   DEPLOY_SSH_KEY       — private key
#   DEPLOY_PATH          — serverda repo path (e.g. /opt/efbazaar)
#
#   ──── App ────
#   POSTGRES_PASSWORD
#   REDIS_PASSWORD
#   JWT_SECRET
#   APP_BASE_URL
#
#   ──── Telegram ────
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_BOT_USERNAME
#   TELEGRAM_GROUP_CHAT_ID
#   TELEGRAM_TOPIC_LOGS
#   TELEGRAM_TOPIC_REGISTRATION
#   TELEGRAM_TOPIC_MEDIA
#   TELEGRAM_WEBHOOK_URL    (production webhook URL; bo'sh qoldirilsa long-polling)
# ==============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Servislar (probel bilan, masalan "auth-service bot"). Bo`sh — hammasi.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      recommendation: ${{ steps.filter.outputs.recommendation }}
      bot: ${{ steps.filter.outputs.bot }}
      frontend: ${{ steps.filter.outputs.frontend }}
      nginx: ${{ steps.filter.outputs.nginx }}
      services: ${{ steps.list.outputs.services }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'backend/auth-service/**'
              - 'docker-compose.yml'
            marketplace:
              - 'backend/marketplace-service/**'
              - 'docker-compose.yml'
            recommendation:
              - 'backend/recommendation-service/**'
              - 'docker-compose.yml'
            bot:
              - 'bot/**'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
            nginx:
              - 'nginx/**'
              - 'docker-compose.yml'
      - id: list
        env:
          MANUAL_SERVICES: ${{ github.event.inputs.services }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$IS_MANUAL" == "true" ]]; then
            if [[ -z "$MANUAL_SERVICES" ]]; then
              LIST="auth-service marketplace-service recommendation-service bot frontend nginx"
            else
              LIST="$MANUAL_SERVICES"
            fi
          else
            LIST=""
            [[ "${{ steps.filter.outputs.auth }}" == "true" ]] && LIST="$LIST auth-service"
            [[ "${{ steps.filter.outputs.marketplace }}" == "true" ]] && LIST="$LIST marketplace-service"
            [[ "${{ steps.filter.outputs.recommendation }}" == "true" ]] && LIST="$LIST recommendation-service"
            [[ "${{ steps.filter.outputs.bot }}" == "true" ]] && LIST="$LIST bot"
            [[ "${{ steps.filter.outputs.frontend }}" == "true" ]] && LIST="$LIST frontend"
            [[ "${{ steps.filter.outputs.nginx }}" == "true" ]] && LIST="$LIST nginx"
          fi
          LIST=$(echo $LIST | xargs)
          echo "services=$LIST" >> "$GITHUB_OUTPUT"
          if [[ -n "$LIST" ]]; then
            echo "any=true"  >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Show services to deploy
        run: echo "Deploying:${{ needs.detect.outputs.services }}"

      - name: Sync code + write .env + restart over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVICES: ${{ needs.detect.outputs.services }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SERVICES,POSTGRES_PASSWORD,REDIS_PASSWORD,JWT_SECRET,APP_BASE_URL,TELEGRAM_BOT_TOKEN,TELEGRAM_BOT_USERNAME,TELEGRAM_GROUP_CHAT_ID,TELEGRAM_TOPIC_LOGS,TELEGRAM_TOPIC_REGISTRATION,TELEGRAM_TOPIC_MEDIA,TELEGRAM_WEBHOOK_URL,DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "▸ Pulling latest code"
            git pull origin main

            echo "▸ Writing .env from GitHub Secrets"
            cat > .env <<EOF
            # === Auto-generated by GitHub Actions deploy ===
            # === Do not edit manually — regenerated on each deploy ===
            POSTGRES_USER=efbazaar
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=postgres
            POSTGRES_PORT=5432
            AUTH_DB_NAME=auth_db
            MARKETPLACE_DB_NAME=marketplace_db
            RECOMMENDATION_DB_NAME=recommendation_db

            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

            KAFKA_BOOTSTRAP_SERVERS=kafka:9092

            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_TOKEN_TTL_MINUTES=15
            JWT_REFRESH_TOKEN_TTL_DAYS=30

            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_BOT_USERNAME=${{ secrets.TELEGRAM_BOT_USERNAME }}
            TELEGRAM_GROUP_CHAT_ID=${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
            TELEGRAM_TOPIC_LOGS=${{ secrets.TELEGRAM_TOPIC_LOGS }}
            TELEGRAM_TOPIC_REGISTRATION=${{ secrets.TELEGRAM_TOPIC_REGISTRATION }}
            TELEGRAM_TOPIC_MEDIA=${{ secrets.TELEGRAM_TOPIC_MEDIA }}
            TELEGRAM_WEBHOOK_URL=${{ secrets.TELEGRAM_WEBHOOK_URL }}

            MEDIA_MIN_FILES=1
            MEDIA_MAX_FILES=6
            MEDIA_MAX_FILE_SIZE_MB=5
            MEDIA_ALLOWED_TYPES=image/jpeg,image/png,image/webp

            SPRING_PROFILES_ACTIVE=docker
            APP_BASE_URL=${{ secrets.APP_BASE_URL }}
            EOF
            chmod 600 .env

            for svc in $SERVICES; do
              echo "▸ Rebuilding and restarting $svc"
              docker compose build "$svc"
              docker compose up -d --no-deps "$svc"
            done
            docker image prune -f
            echo "✓ Deploy finished"

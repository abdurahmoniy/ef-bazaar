global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: efbazaar
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - trade-service:8085

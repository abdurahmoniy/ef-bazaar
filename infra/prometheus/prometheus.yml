global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

# Prometheus qoidalarni hisoblaydi va alertni yoqadi, lekin uni HECH KIMGA
# yubormaydi — yuborish Alertmanager'ning ishi. Bu blok "yonganini kimga
# aytish" degan savolga javob beradi.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: efbazaar
    metrics_path: /actuator/prometheus
    static_configs:
      # Compose servis nomi + ichki port. Prometheus shu tarmoqda turadi,
      # shuning uchun nomlar bo'yicha topadi — nginx ham, IP ham kerak emas.
      - targets:
          - auth-service:8081
          - marketplace-service:8082
          - bot:8084
          - trade-service:8085
          - payment-service:8087

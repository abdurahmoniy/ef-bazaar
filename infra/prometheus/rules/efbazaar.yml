groups:
  - name: efbazaar
    interval: 30s
    rules:
      - alert: DbPoolNearlyFull
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} — ulanish hovuzi to'lmoqda"
          description: "Hovuzning {{ $value | humanizePercentage }} qismi band. Cheklov tor bo'lishi mumkin."

      - alert: ServiceDown
        expr: up{job="efbazaar"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} javob bermayapti"
          description: "Prometheus 2 daqiqadan beri metrika ololmayapti."

      - alert: OutboxBacklog
        expr: outbox_pending_oldest_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} — outbox Kafka'ga yetkazolmayapti"
          description: "Eng eski yetkazilmagan event {{ $value | humanizeDuration }} oldin yozilgan. Kafka yoki relay'ni tekshiring; event'lar yo'qolmagan, navbatda turibdi. Runbook: backend/libs/outbox/README.md → 'OutboxBacklog'."

      - alert: OutboxParked
        expr: outbox_parked_count > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} — Kafka {{ $value }} ta event'ni doimiy rad etdi"
          description: "Event'lar park qilindi (juda katta, noto'g'ri topic yoki ruxsat yo'q); qolgan navbat ishlayapti. Consumer'ga yetmagan — ko'rib chiqing. Runbook: backend/libs/outbox/README.md → 'OutboxParked'."

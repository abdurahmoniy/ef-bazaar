# ==============================================================
# efBazaar — Full stack orchestration
# Foydalanish:
#   cp .env.example .env  # va qiymatlarni to'ldiring
#   docker compose up -d
#   docker compose up -d --no-deps <service>  # selective restart
# ==============================================================

name: efbazaar

services:
  # ---------- Infrastructure ----------

  postgres:
    image: postgres:16-alpine
    container_name: efbazaar-postgres
    restart: unless-stopped
    # 2GB RAM box uchun tuning — default shared_buffers=128MB ko'p.
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
      -c wal_buffers=4MB
      -c random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${AUTH_DB_NAME},${MARKETPLACE_DB_NAME},${RECOMMENDATION_DB_NAME},${TRADE_DB_NAME},${PAYMENT_DB_NAME},${EFBAZAAR_DB_NAME:-efbazaar}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 220m
    memswap_limit: 320m
    networks:
      - efbazaar-net

  redis:
    image: redis:7-alpine
    container_name: efbazaar-redis
    restart: unless-stopped
    # 64MB cap — blacklist + refresh tokenlar uchun yetadi. allkeys-lru: limit'ga yetganda eskini chiqaradi.
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "64mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 96m
    memswap_limit: 128m
    networks:
      - efbazaar-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: efbazaar-kafka
    restart: unless-stopped
    hostname: kafka
    environment:
      # 192m heap + JVM overhead → OOMKilled restart loop. Single-node KRaft uchun 256m minimum.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-node, kichik resurslar — thread/partition'larni kamaytiramiz
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 420m
    memswap_limit: 560m
    networks:
      - efbazaar-net

  # ---------- Backend services ----------

  auth-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-auth-service:${IMAGE_TAG:-latest}
    container_name: efbazaar-auth
    restart: unless-stopped
    environment:
      # Heap 280m (springdoc + spring security + kafka + jpa + redis + flyway = ko'p framework).
      # Avval 180m edi — GC death spiral. Springdoc qo'shilgandan keyin baqomadi.
      JAVA_OPTS: "-Xms96m -Xmx280m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS}
      # Telegram bot token — same bot used for Login Widget validation
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # Google OAuth — ID token audience (set on console.cloud.google.com)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Server-to-server shared secret (/internal/** endpoints). Bo'sh bo'lsa
      # internal endpointlar fail-closed — chat display-name snapshot ishlamaydi.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    mem_limit: 460m
    memswap_limit: 640m
    networks:
      - efbazaar-net

  marketplace-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-marketplace-service:${IMAGE_TAG:-latest}
    container_name: efbazaar-marketplace
    restart: unless-stopped
    environment:
      # Heap 320m — marketplace eng katta (springdoc + spring security + jpa + 2 datasource + flyway + redis + kafka + multipart).
      JAVA_OPTS: "-Xms96m -Xmx320m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${MARKETPLACE_DB_NAME}
      # Card picker uchun 2-DataSource (read-only)
      EFBAZAAR_DB_NAME: ${EFBAZAAR_DB_NAME:-efbazaar}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Required HMAC key for privacy-preserving card-interest dedupe.
      CARD_INTEREST_HMAC_SECRET: ${CARD_INTEREST_HMAC_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      # Media yuklash
      MEDIA_MIN_FILES: ${MEDIA_MIN_FILES}
      MEDIA_MAX_FILES: ${MEDIA_MAX_FILES}
      MEDIA_MAX_FILE_SIZE_MB: ${MEDIA_MAX_FILE_SIZE_MB}
      MEDIA_ALLOWED_TYPES: ${MEDIA_ALLOWED_TYPES}
      # Bot internal URL (rasm forwarding uchun)
      BOT_INTERNAL_BASE_URL: http://bot:8084
      # Auth internal URL + shared secret (chat display-name snapshot uchun)
      AUTH_INTERNAL_BASE_URL: http://auth-service:8081
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      # Debug: 500-larni response body'siga exception class/message qo'shadi.
      # Diagnoz uchun vaqtincha "true" qiling; prod'da "false".
      APP_DEBUG_ERRORS: ${APP_DEBUG_ERRORS:-false}
      # efhub daily card scrape — har kuni 06:00 UTC (11:00 Tashkent).
      # Yakuniga yetgach NotifyMarker.NOTIFY bilan INFO log yozadi, u Kafka
      # log-forwarder orqali Telegram logs topikga chiqadi.
      # Test uchun EFHUB_SYNC_CRON'ni .env'da vaqtincha "0 */5 * * * *"
      # (har 5 daqiqada) qilib qo'yish mumkin, keyin qaytariladi.
      EFHUB_SYNC_ENABLED: ${EFHUB_SYNC_ENABLED:-true}
      EFHUB_SYNC_CRON: ${EFHUB_SYNC_CRON:-0 0 6 * * *}
      # Repair listings created before normalized player-card inventory existed.
      # The job skips listings that are already normalized, so it is safe to leave enabled.
      LISTING_CARD_BACKFILL_ENABLED: ${LISTING_CARD_BACKFILL_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    mem_limit: 420m
    memswap_limit: 580m
    networks:
      - efbazaar-net

  # NOTE: recommendation-service `extra` profile'da — default'da ishga tushmaydi.
  # Yoqish uchun:  docker compose --profile extra up -d
  # Hozir placeholder, MVP'da kerak emas. Nginx /api/rec/ → 503.
  recommendation-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-recommendation-service:${IMAGE_TAG:-latest}
    container_name: efbazaar-rec
    profiles: ["extra"]
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms64m -Xmx160m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${RECOMMENDATION_DB_NAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    mem_limit: 260m
    memswap_limit: 384m
    networks:
      - efbazaar-net

  # ---------- Trade service (escrow orchestrator, Plan B lifecycle) ----------
  trade-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-trade-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend/trade-service
    container_name: efbazaar-trade
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms96m -Xmx280m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TRADE_DB_NAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      MAILCOW_API_URL: https://mailcow.efbazaar.uz/api/v1
      # Mailcow'ning ichki IMAP/dovecot cert'i faqat mail.efbazaar.uz SAN'ni
      # o'z ichiga oladi (SKIP_LETS_ENCRYPT=y + MAILCOW_HOSTNAME=mail.efbazaar.uz).
      # HTTPS API bizning nginx orqali mailcow.efbazaar.uz da, ammo IMAPS
      # to'g'ridan-to'g'ri Mailcow konteyneriga boradi — TLS hostname
      # verification muvaffaqiyatli bo'lishi uchun mail.efbazaar.uz kerak.
      IMAP_HOST: mail.efbazaar.uz
      MASTER_KEY_FILE: /run/secrets/master_key
    secrets:
      - master_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    mem_limit: 384m
    memswap_limit: 512m
    networks:
      - efbazaar-net

  # ---------- Payment service (wallet, deposits, platform cards) ----------
  payment-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-payment-service:${IMAGE_TAG:-latest}
    build:
      context: ./backend/payment-service
    container_name: efbazaar-payment
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms96m -Xmx280m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      MASTER_KEY_FILE: /run/secrets/master_key
    secrets:
      - master_key
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    mem_limit: 384m
    memswap_limit: 512m
    networks:
      - efbazaar-net

  # ---------- Smart-admin worker (Plan C) ----------
  smart-admin-worker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-smart-admin-worker:${IMAGE_TAG:-latest}
    build:
      context: ./smart-admin-worker
    container_name: efbazaar-smart-admin
    restart: unless-stopped
    # Chromium (rotate.py subprocess) needs:
    #   - /dev/shm > 64MB default (crashpad handler heap)
    #   - init: true — Docker's tini as PID 1 correctly reaps subprocesses;
    #     without this Chromium's crashpad_handler gets orphaned/killed by
    #     Python PID 1 and the IPC socket resets before args are passed
    #     (symptom: 'chrome_crashpad_handler: --database is required' +
    #     'recvmsg: Connection reset by peer').
    #   - seccomp=unconfined — Docker's default seccomp profile blocks
    #     syscalls Chromium's sandboxed renderer needs even with
    #     --no-sandbox; loosening this is the standard workaround for
    #     headless Chromium in slim containers.
    shm_size: '2gb'
    init: true
    security_opt:
      - seccomp:unconfined
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MAILCOW_API_URL: https://mailcow.efbazaar.uz/api/v1
      MAILCOW_API_KEY_FILE: /run/secrets/mailcow_api_key
      MASTER_KEY_FILE: /run/secrets/master_key
      # See trade-service block: mail.efbazaar.uz is required for IMAPS TLS
      # SAN validation, not mailcow.efbazaar.uz.
      IMAP_HOST: mail.efbazaar.uz
      IMAP_PORT: "993"
      KONAMI_SENDER_ALLOWLIST: "noreply@konami.com,no-reply@konami.jp,noreply@konami.net,konami-info@konami.net"
      MAX_CONCURRENT_ROTATE: "1"
      MAX_CONCURRENT_ROTATE_CAP: "5"
      IMAP_POLL_INTERVAL_SECONDS: "5"
      WORKER_HEALTHCHECK_PORT: "8086"
      LOG_LEVEL: INFO
      # Optional — mirrored from the bot service. Worker degrades to a silent
      # no-op notifier if any of these is unset.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID}
      TELEGRAM_TOPIC_LOGS: ${TELEGRAM_TOPIC_LOGS}
    secrets:
      - mailcow_api_key
      - master_key
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 720m
    memswap_limit: 900m
    networks:
      - efbazaar-net

  # ---------- Humo userbot (deposit rail) ----------
  # An MTProto *user* session, not a bot: it watches the Humo card bot's chat,
  # parses top-up notifications and publishes them to Kafka. No HTTP surface,
  # so no EXPOSE and no healthcheck — liveness is the Kafka heartbeat, which
  # is what payment-service gates deposits on.
  #
  # The session file in humo-userbot-session is a CREDENTIAL and is created by
  # a one-time interactive login (phone + code + 2FA). Until it exists this
  # container crash-loops: there is no TTY for the prompt. See
  # humo-userbot/README.md.
  humo-userbot:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-humo-userbot:${IMAGE_TAG:-latest}
    build:
      context: ./humo-userbot
    container_name: efbazaar-humo-userbot
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_SESSION_DIR: /session
      HUMO_SOURCE_CHAT: ${HUMO_SOURCE_CHAT:-humocardbot}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      LOG_LEVEL: INFO
    volumes:
      - humo-userbot-session:/session
    depends_on:
      kafka:
        condition: service_started
    mem_limit: 256m
    memswap_limit: 384m
    networks:
      - efbazaar-net

  bot:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-bot:${IMAGE_TAG:-latest}
    container_name: efbazaar-bot
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms64m -Xmx160m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_GROUP_CHAT_ID: ${TELEGRAM_GROUP_CHAT_ID}
      TELEGRAM_TOPIC_LOGS: ${TELEGRAM_TOPIC_LOGS}
      TELEGRAM_TOPIC_REGISTRATION: ${TELEGRAM_TOPIC_REGISTRATION}
      TELEGRAM_TOPIC_MEDIA: ${TELEGRAM_TOPIC_MEDIA}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
    depends_on:
      kafka:
        condition: service_started
    mem_limit: 280m
    memswap_limit: 384m
    networks:
      - efbazaar-net

  # ---------- Frontend ----------

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-frontend:${IMAGE_TAG:-latest}
    container_name: efbazaar-frontend
    restart: unless-stopped
    environment:
      # Server (Node) ichidan backend'ga ichki tarmoq orqali ulanish
      INTERNAL_API_BASE_URL: http://nginx:8080/api
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-efbazaar.uz}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.efbazaar.uz}
      NEXT_PUBLIC_TELEGRAM_BOT: ${TELEGRAM_BOT_USERNAME}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_BASE_URL: ${APP_BASE_URL}
      NODE_OPTIONS: "--max-old-space-size=192"
    # Next.js standalone Node server — 150-200MB ishlatadi
    mem_limit: 256m
    memswap_limit: 384m
    networks:
      - efbazaar-net

  # ---------- Mail frontend (mail.efbazaar.uz) ----------
  # Read-only webmail app — trade-service /api/v1/mail/** ni ko'rsatadi.
  # Login UI yo'q: auth cookie'lar Domain=efbazaar.uz bilan yozilgani uchun
  # asosiy saytdagi session shu subdomain'da ham amal qiladi.

  mail-frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-mail-frontend:${IMAGE_TAG:-latest}
    container_name: efbazaar-mail-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://nginx:8080/api
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-efbazaar.uz}
      NEXT_PUBLIC_MAIN_SITE_URL: ${APP_BASE_URL:-https://efbazaar.uz}
      NODE_OPTIONS: "--max-old-space-size=192"
    mem_limit: 256m
    memswap_limit: 384m
    networks:
      - efbazaar-net

  # ---------- Reverse proxy ----------

  nginx:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-abdurahmoniy/efbazaar}-nginx:${IMAGE_TAG:-latest}
    container_name: efbazaar-nginx
    restart: unless-stopped
    environment:
      # Snake-oil bootstrap uchun domenlar (har biri uchun alohida SAN papka).
      # efbazaar.uz → efbazaar.uz + api.efbazaar.uz; chempox.uz → chempox.uz +
      # www + api.chempox.uz (Chempionat-X co-location, chempox.conf).
      TLS_DOMAINS: "efbazaar.uz chempox.uz"
      # Chempionat-X header-auth uchun /api/tournaments route'ida yuboriladi
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    # mailcow.efbazaar.uz uchun Mailcow host loopback'ida (127.0.0.1:8443) tinglaydi.
    # Konteyner ichidan unga yetish uchun host-gateway mapping kerak.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - letsencrypt_data:/etc/letsencrypt           # Real Let's Encrypt certlar (certbot bilan baham ko'riladi)
      - acme_challenge:/var/www/certbot              # ACME HTTP-01 challenge fayllari
      - nginx_auth:/etc/nginx/auth                   # htpasswd (init-cert.sh yozadi)
    depends_on:
      - auth-service
      - marketplace-service
      - bot
      - frontend
      - mail-frontend
    mem_limit: 64m
    memswap_limit: 96m
    networks:
      - efbazaar-net

  # ---------- Certbot — Let's Encrypt cert issuance + renewal ----------
  # First boot: 'docker compose run --rm certbot certonly --webroot ...' qo'lda chaqiring (init-cert.sh).
  # Keyinroq: bu kontayner background'da renew --webroot ni har 12 soatda ishlatadi.
  certbot:
    image: certbot/certbot:latest
    container_name: efbazaar-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - acme_challenge:/var/www/certbot
    # Har 12 soatda renew + nginx reload
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
       while :; do
         certbot renew --webroot --webroot-path=/var/www/certbot --quiet --no-random-sleep-on-renew;
         sleep 12h & wait $${!};
       done"
    mem_limit: 64m
    memswap_limit: 96m
    networks:
      - efbazaar-net

# ==============================================================

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  letsencrypt_data:
  acme_challenge:
  nginx_auth:
  # Holds the Pyrogram .session credential — created by a one-time interactive
  # login, never rebuilt automatically. Deleting it means redoing that login.
  humo-userbot-session:

networks:
  efbazaar-net:
    driver: bridge

secrets:
  master_key:
    file: ./infra/secrets/master_key
  mailcow_api_key:
    file: ./infra/secrets/mailcow_api_key

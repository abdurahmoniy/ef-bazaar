spring:
  application:
    name: marketplace-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:marketplace_db}
    username: ${POSTGRES_USER:efbazaar}
    password: ${POSTGRES_PASSWORD:efbazaar}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      max-lifetime: 600000  # 10 minutes, shorter than DB idle timeout

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: marketplace-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # O'ralgan, xom emas. Xom JsonDeserializer xatosi poll() ning O'ZIDAN
      # otiladi va u yerga hech qanday listener error handler yeta olmaydi:
      # offset commit qilinmaydi va konteyner o'sha xabarni cheksiz qayta
      # o'qiydi. 2026-09-09 da trade-service shu sababli ikki yadroni yoqdi.
      # O'ralganda xato xabarning yuki bo'lib keladi, error handler uni DLT
      # ga qo'yadi va yomon xabar butun servisga emas, bitta offsetga tushadi.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "uz.efbazaar.*"

  servlet:
    multipart:
      # 60MB: qo'llanma videosi Telegram chegarasi bo'yicha 50MB gacha,
      # qolgani multipart qo'shimchalari uchun. Ilgari 10MB edi va video
      # KODGA YETIB BORMASDAN rad etilardi — 50MB tekshiruvimiz ishga
      # tushishga ham ulgurmasdi.
      #
      # Xotira xavfi yo'q: fayllar diskka yoziladi va yuqoriga OQIM bilan
      # uzatiladi (GuideVideoUploader, MediaUploadController). Rasm hajmi
      # esa alohida, ilova darajasida cheklanadi (MediaService.validate).
      max-file-size: 60MB
      max-request-size: 120MB

server:
  port: 8082
  # Nginx (proxy-common.inc) sends X-Forwarded-Proto/Host — honor them so springdoc
  # generates https://api.efbazaar.uz in OpenAPI servers[] instead of plain http.
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    kafka:
      enabled: false
  # Javob vaqti uchun histogram bucket'lari — p95/p99 shusiz hisoblanmaydi.
  # Chegaralar bucket sonini jilovlaydi; izoh auth-service'da to'liqroq.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s

app:
  cards:
    # efbazaar DB — efhub.com'dan scrape qilingan player cards.
    # marketplace-service uchun 2-DataSource. Card picker API + sync job ishlatadi.
    datasource:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${EFBAZAAR_DB_NAME:efbazaar}
      username: ${POSTGRES_USER:efbazaar}
      password: ${POSTGRES_PASSWORD:efbazaar}
      driver-class-name: org.postgresql.Driver
      # Kartalar pickeri va kunlik sync uchun — kichik hovuz yetadi.
      # Ulanish byudjeti uchun asosiy datasource izohiga qarang.
      hikari:
        maximum-pool-size: 4
        max-lifetime: 600000  # 10 minutes, shorter than DB idle timeout
    sync:
      # efhub.com'dan kunlik delta-sync. Faqat yangi card'larni tortib oladi.
      # Production: enabled=true, local dev: false (default) — efhub'ga ortiqcha so'rov ketmasin.
      enabled: ${EFHUB_SYNC_ENABLED:false}
      cron: ${EFHUB_SYNC_CRON:0 0 9 * * *}   # har kuni 09:00 UTC = 14:00 Toshkent
      delay-ms: ${EFHUB_SYNC_DELAY_MS:5000}  # so'rovlar orasi (robots.txt Crawl-delay: 5)
      batch-limit: ${EFHUB_SYNC_BATCH_LIMIT:50}
      base-url: ${EFHUB_BASE_URL:https://efhub.com}
      index-url: ${EFHUB_INDEX_URL:https://efhub.com/search/player-index.json}
      request-timeout-seconds: 30
      retries: 3
  media:
    min-files: ${MEDIA_MIN_FILES:1}
    max-files: ${MEDIA_MAX_FILES:6}
    max-file-size-mb: ${MEDIA_MAX_FILE_SIZE_MB:5}
    allowed-types: ${MEDIA_ALLOWED_TYPES:image/jpeg,image/png,image/webp,image/heic,image/heif}
  bot:
    internal-base-url: ${BOT_INTERNAL_BASE_URL:http://bot:8084}
  payment:
    # Hamkorlik to'lovi shu servisdagi hamyondan yechiladi — savdolar bilan
    # bir xil pul yo'li.
    internal-base-url: ${PAYMENT_INTERNAL_BASE_URL:http://payment-service:8087}
  trade:
    # Chat tarixini tozalashdan oldin "shu chatda tirik savdo bormi" deb
    # so'raladi. Savdo holati trade-service'niki va shu yerda
    # takrorlanmaydi — ikkala nusxa albatta bir kun ajralib ketardi.
    internal-base-url: ${TRADE_INTERNAL_BASE_URL:http://trade-service:8085}
  web:
    # Kanal postlaridagi va rasmiy kanaldagi e'lon havolalarining asosi.
    # ATAYLAB env'dan: staging post chiqarsa, undagi havola production
    # e'loniga olib borardi va buni hech kim sezmasdi.
    base-url: ${APP_BASE_URL:https://efbazaar.uz}
  telegram:
    # Kanal postidagi tugma shu manzilga boradi va Mini App'ni Telegram
    # ichida ochadi: t.me/<bot>/<app>?startapp=<e'lon id>[_<hamkor kodi>].
    # Qisqa nom BotFather'da /newapp bilan ochiladi.
    #
    # BO'SH QOLDIRILSA tugma eski sayt havolasiga tushadi va brauzerda
    # ochiladi — sozlanmagan muhitda tugma o'lik bo'lib qolmasin.
    mini-app-url: ${TELEGRAM_MINI_APP_URL:}
  channels:
    # efBazaar rasmiy kanali — har bir e'lon shu yerga ham tushadi.
    # @username yoki raqamli id.
    #
    # Manba: GitHub repo secret OFFICIAL_CHANNEL -> deploy.yml -> deploy.sh
    # -> .env -> docker-compose. Serverda .env ni qo'lda tahrirlash foydasiz:
    # deploy.sh uni har deployda bo'shatib qayta yozadi va qo'lda qo'yilgan
    # qiymat jimgina yo'qoladi.
    #
    # BO'SH BO'LSA butunlay o'chiq: sozlanmagan muhit na yiqilishi, na
    # noto'g'ri joyga post qilishi kerak. Jonli kanalga tushgan postni
    # orqaga qaytarib bo'lmaydi.
    official: ${OFFICIAL_CHANNEL:}
  partners:
    # Fiks rejimdagi hamkorlarga o'tgan oy uchun to'lov — har oyning 1-sanasi.
    monthly-cron: ${PARTNER_MONTHLY_CRON:0 0 4 1 * *}
    # Kanallarni Telegram'dan qayta o'qish: obunachi soni, nom va avatar.
    # Tekshiruv paytida bir marta olingan raqamlar eskiradi, sotuvchi esa
    # aynan o'sha obunachi soniga qarab pul to'laydi.
    refresh-cron: ${PARTNER_REFRESH_CRON:0 30 3 * * *}
    # Necha kun KETMA-KET o'qib bo'lmasa hamkorlik to'xtaydi. Bir kunlik
    # xato Telegram'ning vaqtincha javob bermasligi bo'lishi mumkin —
    # birinchi xatoda odamning hamkorligini tugatib bo'lmaydi.
    refresh-failure-limit: ${PARTNER_REFRESH_FAILURE_LIMIT:3}
  # Server-to-server access to auth-service's /internal/** endpoints
  # (currently: user display-name resolution at chat creation). If
  # internal-secret is unset the resolver short-circuits and the frontend
  # falls back to a role label ("Xaridor" / "Sotuvchi").
  auth:
    internal-base-url: ${AUTH_INTERNAL_BASE_URL:http://auth-service:8081}
    internal-secret: ${INTERNAL_API_SECRET:}
  # Shared secret required on INBOUND /internal/** calls (e.g. Chempionat-X
  # trust bridge). Blank → filter rejects all such traffic. Reuses the same
  # env var as outbound so services on the docker network share one secret.
  internal:
    secret: ${INTERNAL_API_SECRET:}
  # "Akkountlarim" joriy qilinishidan oldingi FAOL e'lonlar uchun bir
  # martalik ta'mir. Qayta ishga tushirish xavfsiz: mavjud akkountlar
  # o'tkazib yuboriladi.
  user-account-backfill:
    enabled: ${USER_ACCOUNT_BACKFILL_ENABLED:false}
    batch-size: 200
  listing-card-backfill:
    # One-off repair for listings created before normalized card inventory.
    # Safe to enable again: it keyset-pages listings and replaces rows idempotently.
    enabled: ${LISTING_CARD_BACKFILL_ENABLED:false}
    batch-size: ${LISTING_CARD_BACKFILL_BATCH_SIZE:200}
  card-interest:
    # Required rotatable secret used only to pseudonymize user/network dedupe identities.
    # No checked-in fallback: a missing production secret must fail startup.
    hmac-secret: ${CARD_INTEREST_HMAC_SECRET:}
  # "Katta bozor" reyting formulasi konstantalari (spec §5.4).
  recommendation:
    value-score:
      rating-floor: 80
      rating-span: 20
      meta-base: 2.0
      meta-priority-step: 0.25
      card-cap: 15
      price-floor: 5000
      price-cap: 50000000
      price-weight: 0.5
      backfill-enabled: ${VALUE_SCORE_BACKFILL_ENABLED:true}
    meta-boundary-cron: ${META_BOUNDARY_CRON:0 5 0 * * *}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false      # UI auth-service'da aggregated, faqat api-docs JSON beradi
  show-actuator: false

logging:
  level:
    root: INFO
    uz.efbazaar: DEBUG

# Enable only with Firebase Application Default Credentials configured.
notifications:
  push:
    enabled: ${FIREBASE_PUSH_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Bizda JWT-based custom auth bor — Spring'ning default UserDetailsService kerak emas.
  # Exclude qilmasak, har start'da "Using generated security password: ..." warn chiqaradi.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:auth_db}
    username: ${POSTGRES_USER:efbazaar}
    password: ${POSTGRES_PASSWORD:efbazaar}
    driver-class-name: org.postgresql.Driver
    # ── Ulanish byudjeti ────────────────────────────────────────────
    # Postgres'da max_connections=50 (docker-compose.yml). Hovuzlar
    # yig'indisi undan OSHMASLIGI kerak — 2026-08-22 kechasi backup aynan
    # shu sababdan yiqilgan: "FATAL: sorry, too many clients already".
    #
    # Hikari'da maximum-pool-size sozlanmasa 10 bo'ladi, minimum-idle esa
    # maximum-pool-size'ga tenglashadi — ya'ni har hovuz bo'sh turganda ham
    # 10 ta ulanishni ochib USHLAB turadi. Beshta servis + marketplace'ning
    # ikkinchi (cards) datasource'i = 5 hovuz × 10 = 50. Sig'im 50.
    #
    # Joriy taqsimot (jami 40, qolgan 10 — admin, backup, psql uchun):
    #   auth 6 | marketplace 8 (+cards 4) | trade 8 | payment 6 | access 4 | recommendation 4
    #
    # Yangi servis yoki datasource qo'shsangiz, shu jadvalni yangilang va
    # yig'indi 50 dan past qolishiga ishonch hosil qiling.
    hikari:
      maximum-pool-size: 6

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auth-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "uz.efbazaar.*"
        # Boshqa servis (bot) yuborgan __TypeId__ header'ini ignore qilamiz —
        # auth-service'da o'sha class yo'q, faqat o'z DTO'larimizga deserialize bo'lsin.
        spring.json.use.type.headers: false

server:
  port: 8081
  # Nginx (proxy-common.inc) sends X-Forwarded-Proto/Host — honor them so springdoc
  # generates https://api.efbazaar.uz in OpenAPI servers[] instead of plain http.
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    # Kafka DOWN'ligi /actuator/health'ni DOWN qilmasin — Docker healthcheck pass bo'lishi uchun.
    # Kafka holatini kuzatish uchun /actuator/metrics yoki alohida endpoint ishlatish kerak.
    kafka:
      enabled: false
  # Javob vaqti uchun histogram bucket'lari — p95/p99 shusiz hisoblanmaydi.
  # Standart holatda Micrometer faqat count va sum beradi, ya'ni faqat
  # o'rtachani; o'rtacha esa kam sonli sekin so'rovlarni yashiradi.
  #
  # Chegaralar ataylab: bucket soni oraliqqa bog'liq, chegarasiz histogram
  # har bir endpoint uchun ~70 qator chiqaradi va Prometheus xotirasi
  # endpointlar soniga ko'payib o'sadi.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s

app:
  # Requests-per-minute per client IP. Set enabled=false to disable in dev if
  # Redis is not available. Keys are the exact request URI (not a prefix match).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    endpoints:
      /api/v1/auth/telegram: ${RATE_LIMIT_TELEGRAM:20}
      /api/v1/auth/telegram-webapp: ${RATE_LIMIT_TELEGRAM_WEBAPP:20}
      /api/v1/auth/google/login: ${RATE_LIMIT_GOOGLE_LOGIN:20}
      /api/v1/auth/refresh: ${RATE_LIMIT_REFRESH:60}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-min-32-bytes-long}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    login-max-age-seconds: 86400
    # Telegram Bot API base — overridable for local tests.
    api-base-url: https://api.telegram.org
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # Shared secret for server-to-server calls to /internal/**. Set to a strong
  # value in every non-local environment. If unset or blank the internal
  # endpoints refuse every request (fail-closed).
  internal:
    secret: ${INTERNAL_API_SECRET:}
  # Kirish shartlari (kanal a'zoligi) — access-service. Bo'sh bo'lsa tekshiruv
  # o'chiq; servis javob bermasa login baribir o'tadi (AccessGate izohi).
  access:
    internal-base-url: ${ACCESS_INTERNAL_BASE_URL:}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
    # Aggregated swagger UI: dropdown'da public HTTP API servislar.
    # URL'lar `api.efbazaar.uz` orqali chiqadi (nginx routing).
    urls:
      - name: auth
        url: /v3/api-docs/auth
      - name: marketplace
        url: /v3/api-docs/marketplace
      - name: bot
        url: /v3/api-docs/bot
      - name: trade
        url: /v3/api-docs/trade
      - name: payment
        url: /v3/api-docs/payment
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: method
    # Send browser cookies (accessToken httpOnly) on every "Try it out" fetch.
    # This is how the frontend dev tests protected endpoints without ever
    # touching the raw JWT — sign in on efbazaar.uz, open the Swagger tab on
    # api.efbazaar.uz, cookie rides along because AUTH_COOKIE_DOMAIN is set
    # to the registrable domain.
    with-credentials: true
  show-actuator: false

logging:
  level:
    root: INFO
    uz.efbazaar: DEBUG
    org.springframework.security: INFO

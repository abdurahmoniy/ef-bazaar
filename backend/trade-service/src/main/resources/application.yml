spring:
  application:
    name: trade-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trade_db}
    username: ${POSTGRES_USER:efbazaar}
    password: ${POSTGRES_PASSWORD:efbazaar}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: trade-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wrapped, not raw. A raw JsonDeserializer failure is thrown out of poll()
      # itself, where no listener error handler can reach it and the offset is
      # never committed — the container then re-polls the same record for ever.
      # That is exactly what one unreadable user-role-changed record did on
      # 2026-09-07. Wrapped, the failure travels as the record's payload, the
      # error handler in KafkaErrorHandlingConfig parks it on a DLT, and the
      # bad record costs one offset instead of the service.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "uz.efbazaar.*"

app:
  auth:
    internal-base-url: ${AUTH_INTERNAL_BASE_URL:http://auth-service:8081}
    internal-secret: ${INTERNAL_API_SECRET:}
  marketplace:
    internal-base-url: ${MARKETPLACE_INTERNAL_BASE_URL:http://marketplace-service:8082}
  # Servislararo /internal/** chaqiruvlari uchun umumiy sir. Marketplace'da
  # ham aynan shu nom bilan turadi va bir xil INTERNAL_API_SECRET dan
  # o'qiydi — nomlar mos kelmasa chaqiruv bo'sh sarlavha bilan ketadi va
  # qabul qiluvchi uni "mismatch" deb rad etadi.
  internal:
    secret: ${INTERNAL_API_SECRET:}

server:
  port: 8085
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    kafka:
      enabled: false
  # Javob vaqti uchun histogram bucket'lari — p95/p99 shusiz hisoblanmaydi.
  # Chegaralar bucket sonini jilovlaydi; izoh auth-service'da to'liqroq.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s

trade:
  scheduler:
    sweep-interval-ms: 10000
    # Separate from the timeout sweep — see TradeEscalationSweeper's javadoc.
    escalation-sweep-interval-ms: 60000
    escalation-sweep-batch-size: 200
  crypto:
    master-key-file: ${MASTER_KEY_FILE:}
  timeouts:
    waiting-payment-seconds: 1800
    waiting-email-change-seconds: 1800
    verifying-konami-link-seconds: 1800
    waiting-password-seconds: 1800
    waiting-buyer-verify-seconds: 86400
    # ----- human trade-admin mode -----
    # Nobody accepted the invitation → ORPHANED. Nothing has happened yet.
    human-waiting-admin-seconds: 86400
    # Admin closed, parties silent → SUCCESS (spec §3.8).
    human-close-confirm-seconds: 86400
    # Admin's last action was this long ago → escalate to a platform admin.
    # NOT a state_deadline: see TradeStateHandler.onEnter(IN_PROGRESS).
    human-admin-idle-seconds: 43200
  recheck:
    max-per-trade: 5
    min-interval-seconds: 300
  human:
    # A hand-run trade legitimately takes days; the smart path stays at 24h.
    expires-after-hours: 168
    rating-window-days: 7
  proposal:
    ttl-seconds: 600
  presence:
    # A user is "online" if they hit trade-service within this window.
    # Replaced wholesale by the global presence spec.
    online-ttl-seconds: 120
  admin-catalog:
    name-cache-ttl-seconds: 60
  mailcow:
    api-url: ${MAILCOW_API_URL:https://mailcow.efbazaar.uz/api/v1}
  mailbox:
    # Domain appended to the local part an admin types when registering a
    # mailbox. Must match smart-admin-worker's MAILCOW_DOMAIN or the row and
    # the actual Mailcow box would disagree on the address.
    domain: ${MAILBOX_DOMAIN:efbazaar.uz}
    # Every domain mailboxes may be opened on (admin panel, custom boxes),
    # comma-separated, default first. Each must exist in Mailcow.
    domains: ${MAILBOX_DOMAINS:efbazaar.uz}
    # Plans that may claim a custom box on a non-default domain.
    premium-domain-plans: ${MAILBOX_PREMIUM_DOMAIN_PLANS:MAX,STAFF}
  mail:
    imap:
      # Mailcow'ning dovecot cert'i faqat MAILCOW_HOSTNAME (mail.efbazaar.uz)
      # SAN'ini o'z ichiga oladi. HTTPS admin API mailcow.efbazaar.uz da
      # (nginx orqali), lekin IMAPS to'g'ridan Mailcow konteynerga boradi va
      # TLS hostname verification uchun mail.efbazaar.uz kerak.
      host: ${IMAP_HOST:mail.efbazaar.uz}
      port: ${IMAP_PORT:993}
      connection-timeout-ms: 10000
      read-timeout-ms: 15000
      # 5-min TTL for pooled connections; sweep every 60s.
      pool-ttl-seconds: 300
      pool-sweep-seconds: 60
    rate-limit:
      # per-user, per-second ceiling for /api/v1/mail/** endpoints
      per-user-per-second: 10

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false      # UI auth-service'da aggregated, faqat api-docs JSON beradi
  show-actuator: false

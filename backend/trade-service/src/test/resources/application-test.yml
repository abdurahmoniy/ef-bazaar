spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  # Kafka bootstrap comes from @DynamicPropertySource in AbstractIntegrationIT
  kafka:
    consumer:
      # Faster group assignment in tests — default is 3s
      properties:
        session.timeout.ms: 6000
        heartbeat.interval.ms: 2000

trade:
  crypto:
    master-key-file: ${MASTER_KEY_FILE:target/test-master-key}
  timeouts:
    # Shorter windows so timeout scheduler tests don't take 30 min
    waiting-payment-seconds: 2
    waiting-email-change-seconds: 2
    verifying-konami-link-seconds: 2
    waiting-password-seconds: 2
    waiting-buyer-verify-seconds: 2
  recheck:
    max-per-trade: 3
    min-interval-seconds: 1
  proposal:
    ttl-seconds: 60

# Bu servisning O'Z loglarini Kafka'ga uzatish — testlarda o'chiq.
#
# Broker yo'q paytda `KafkaTemplate.send` metadata kutib `max.block.ms`
# (default 60s) gacha CHAQIRUVCHI THREADNI bloklaydi. Kontekst ko'tarilishida
# bir nechta WARN chiqadi va har biri shuncha turadi — CI 8 daqiqa qotib
# qoldi, sabab log uzatgich edi, sinalayotgan kod emas.
#
# Produksiyada uzatish alohida threadda ketadi (KafkaLogForwarder), lekin
# testlarda uni umuman yoqmaslik toza: sinalayotgan narsa bu emas.
app:
  internal:
    # Ichki API testlarida sir bo'sh bo'lmasligi SHART: filtr bo'sh sirni
    # ham rad etadi (fail-closed) va endpoint hech qachon javob bermasdi.
    secret: test-internal-secret
  logging:
    kafka-forward:
      enabled: false

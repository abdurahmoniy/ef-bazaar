# Test profile — activated by AbstractPostgresIT's @ActiveProfiles("test").
#
# Announcements are off by default so the suites written before this feature
# keep passing without a `bot` to talk to. The tests that are about the
# announcement (InvoiceNoticeIT, DeadBotStillCreditsIT) turn it back on for
# themselves with @TestPropertySource.
payment:
  admin-telegram:
    enabled: false

# No broker runs in the suite, so every publish waits out the producer's
# metadata timeout before giving up. Production bounds that at 2s to keep a
# Kafka outage off the request thread; here it can be far shorter, because
# there is nothing to wait for. Left as a real send rather than a stub so the
# publisher's own error handling is exercised.
spring:
  kafka:
    producer:
      properties:
        max.block.ms: 50

# Bu servisning O'Z loglarini Kafka'ga uzatish — testlarda o'chiq.
#
# Broker yo'q paytda `KafkaTemplate.send` metadata kutib `max.block.ms`
# (default 60s) gacha CHAQIRUVCHI THREADNI bloklaydi. Kontekst ko'tarilishida
# bir nechta WARN chiqadi va har biri shuncha turadi — CI 8 daqiqa qotib
# qoldi, sabab log uzatgich edi, sinalayotgan kod emas.
#
# Produksiyada uzatish alohida threadda ketadi (KafkaLogForwarder), lekin
# testlarda uni umuman yoqmaslik toza: sinalayotgan narsa bu emas.
app:
  logging:
    kafka-forward:
      enabled: false

# Most database tests deliberately have no broker. Bound the new outbox sender's
# own metadata/ack wait as well, so cached contexts do not occupy DB connections
# for 10 seconds per retry. PlanDeliveryIT uses a real broker and overrides to 2s.
outbox:
  relay:
    send-timeout: 100ms

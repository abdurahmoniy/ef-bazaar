spring:
  mvc:
    # ResponseStatusException carries a reason the caller shows the user —
    # "not enough money", and whose wallet. Without this Spring answers with
    # the default error body, which drops it, and trade-service falls back to
    # "the wallet refused the operation". Every escrow refusal read like that.
    problemdetails:
      enabled: true
  application:
    name: payment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payment_db}
    username: ${POSTGRES_USER:efbazaar}
    password: ${POSTGRES_PASSWORD:efbazaar}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 6

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # send() blocks waiting for cluster metadata, and the default is 60s.
        # These events are published from AFTER_COMMIT listeners that run on the
        # request thread, so an unreachable broker would hang the caller's HTTP
        # request for a minute rather than failing. Two seconds is long enough
        # for a healthy cluster and short enough that an outage degrades to a
        # logged miss.
        max.block.ms: 2000
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # The heartbeat topic is fed by a process outside this codebase, so it will
      # eventually carry something we cannot read. Unwrapped, a JsonDeserializer
      # failure surfaces as a SerializationException the container's error handler
      # refuses to touch, and the consumer re-polls the same offset forever — one
      # bad message would stall the heartbeat, which stalls every deposit.
      # Wrapped, the bad record costs one offset and the listener moves on.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "uz.efbazaar.*"

server:
  port: 8087
  # Nginx (proxy-common.inc) sends X-Forwarded-Proto/Host — honor them so springdoc
  # generates https://api.efbazaar.uz in OpenAPI servers[] instead of plain http.
  forward-headers-strategy: framework

app:
  internal:
    # Shared secret for /internal/** (trade-service → escrow). Blank refuses
    # every internal call — these endpoints move money between wallets.
    secret: ${INTERNAL_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # Javob vaqti uchun histogram bucket'lari — p95/p99 shusiz hisoblanmaydi.
  # Chegaralar bucket sonini jilovlaydi; izoh auth-service'da to'liqroq.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s

payment:
  crypto:
    master-key-file: ${MASTER_KEY_FILE:}
  deposit:
    minimum-uzs: 1000
    invoice-ttl-minutes: 15
    bump-step-uzs: 100
    max-bump-uzs: 1000
  userbot:
    heartbeat-timeout-seconds: 180
  scheduler:
    expiry-sweep-interval-ms: 30000
  # The admin payments topic. This service renders the text and posts it at
  # `bot`, which owns the bot token, the group chat id and the thread id — none
  # of those identifiers exist in this service's environment.
  admin-telegram:
    enabled: ${PAYMENT_ADMIN_TELEGRAM_ENABLED:true}
    bot-base-url: ${BOT_INTERNAL_BASE_URL:http://bot:8084}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: false      # UI auth-service'da aggregated, faqat api-docs JSON beradi
  show-actuator: false

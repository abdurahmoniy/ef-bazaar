spring:
  application:
    name: payment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payment_db}
    username: ${POSTGRES_USER:efbazaar}
    password: ${POSTGRES_PASSWORD:efbazaar}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # The heartbeat topic is fed by a process outside this codebase, so it will
      # eventually carry something we cannot read. Unwrapped, a JsonDeserializer
      # failure surfaces as a SerializationException the container's error handler
      # refuses to touch, and the consumer re-polls the same offset forever — one
      # bad message would stall the heartbeat, which stalls every deposit.
      # Wrapped, the bad record costs one offset and the listener moves on.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "uz.efbazaar.*"

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health

payment:
  crypto:
    master-key-file: ${MASTER_KEY_FILE:}
  deposit:
    minimum-uzs: 1000
    invoice-ttl-minutes: 15
    bump-step-uzs: 100
    max-bump-uzs: 1000
  userbot:
    heartbeat-timeout-seconds: 180
  scheduler:
    expiry-sweep-interval-ms: 30000

# Optional overlay, used only when Firebase push is enabled.
# Paths in this file resolve relative to the main repository compose file.
services:
  marketplace-service:
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_FILE:?Set FIREBASE_CREDENTIALS_FILE to the server-side service account JSON path}
        target: /run/secrets/firebase-admin.json
        read_only: true
